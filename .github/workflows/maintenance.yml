name: SILAVU nightly backup and housekeeping

# Once a night: a full private backup of the admin's data into the backend's
# private "exports" bucket, then the housekeeping (visit records past the
# retention set in Settings, spent rate-limit counters, scheduled backups past
# EXPORT_KEEP_DAYS). Nothing personal passes through GitHub: the functions
# answer with counts and a file name only. Does nothing until the backend is
# connected (ADMIN_SETUP.md).

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # GitHub's signed statement of this run, which the backend checks

concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      FN: ${{ vars.SILAVU_SUPABASE_URL || 'https://bugfiwulkbsjelmswcjh.supabase.co' }}/functions/v1
      TOKEN: ${{ secrets.SILAVU_BUILD_TOKEN }}
    steps:
      - name: Backup
        run: |
          T="$TOKEN"; [ -n "$T" ] || T=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=silavu-build" | jq -r .value)
          curl -fsS --retry 3 --retry-all-errors -X POST "$FN/export" \
            -H "authorization: Bearer $T" -H "content-type: application/json" \
            -d '{"scheduled":true}'
      - name: Housekeeping
        run: |
          T="$TOKEN"; [ -n "$T" ] || T=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=silavu-build" | jq -r .value)
          curl -fsS --retry 3 --retry-all-errors -X POST "$FN/maintenance" \
            -H "authorization: Bearer $T" -H "content-type: application/json" -d '{}'
