name: SILAVU static site (GitHub Pages)

on:
  push:
    branches: [claude/isracard-dev-environment-tzc6s5]
    paths: ["lumera/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  # a publish in the admin (functions/publish sends this, naming the release)
  repository_dispatch:
    types: [silavu-publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Set once the backend exists (ADMIN_SETUP.md), in Settings → Secrets and variables → Actions:
  #   variables (public): SILAVU_SUPABASE_URL, SILAVU_SUPABASE_ANON_KEY
  #   secret:             SILAVU_BUILD_TOKEN
  # Without them the site builds exactly as before and the admin says it is not connected.
  SILAVU_SUPABASE_URL: ${{ vars.SILAVU_SUPABASE_URL }}
  SILAVU_SUPABASE_ANON_KEY: ${{ vars.SILAVU_SUPABASE_ANON_KEY }}
  SILAVU_FUNCTIONS_URL: ${{ vars.SILAVU_SUPABASE_URL && format('{0}/functions/v1', vars.SILAVU_SUPABASE_URL) || '' }}
  SILAVU_BUILD_TOKEN: ${{ secrets.SILAVU_BUILD_TOKEN }}
  SILAVU_LIVE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
  RELEASE_ID: ${{ github.event.client_payload.release }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.content.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            lumera/package-lock.json
            lumera/admin/package-lock.json
      # the minifier the page build uses (postcss, cssnano, terser)
      - name: Build tools
        run: npm ci --prefix lumera --ignore-scripts --no-audit --no-fund
      # what the owner has published: the backend, else the copy the live site serves, else the seed
      - name: Published content
        id: content
        run: node lumera/site/content-fetch.mjs
      - name: Report the build started
        if: steps.content.outputs.release != '' && env.SILAVU_BUILD_TOKEN != ''
        run: |
          curl -fsS -X POST "$SILAVU_FUNCTIONS_URL/release-status" -H "authorization: Bearer $SILAVU_BUILD_TOKEN" -H "content-type: application/json" \
            -d "{\"release\": ${{ steps.content.outputs.release }}, \"status\": \"building\", \"url\": \"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" || echo "status not reported"
      - name: The page, with the published content
        run: cd lumera/site/src && node build.mjs
      - name: Static index
        run: node lumera/site/gen-static.mjs lumera/site/silavu-page.html dist "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
      - name: Icons, manifest, OG image
        run: cp -rv lumera/site/public/* dist/
      # Fifty-six photographs and four videos that are not in the repository.
      # They came from one preview host, and when that host answered 503 for six
      # minutes the whole deploy died on a single missing file — the site that
      # was already live would have been fine. It tries the published site as a
      # second source now: whatever shipped last time is, by definition, there.
      - name: Photographs and the box film (from the preview host, or from what is already live)
        run: |
          set -e
          LIVE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          PREVIEW="https://silavu-house.higgsfield.app"
          get() { curl -fsSL --retry 4 --retry-delay 3 --retry-all-errors --connect-timeout 15 --max-time 180 -o "dist/$2" "$1/$2"; }
          fetch() {
            mkdir -p "dist/$(dirname "$1")"
            get "$PREVIEW" "$1" && return 0
            echo "  preview missed $1 — trying the published site"
            get "$LIVE" "$1" && return 0
            rm -f "dist/$1"; echo "missing: $1"; return 1
          }
          rc=0
          while read -r f; do [ -n "$f" ] && { fetch "$f" || rc=1; }; done < lumera/site/static-assets.txt
          du -sh dist; find dist -type f | wc -l
          exit $rc
      - name: ImageMagick and ffmpeg for the crops and the film
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick ffmpeg
      # The two portrait loops are what a phone actually downloads, and they
      # arrived at 3.3MB and 4.8MB — eight megabytes of background motion
      # before a single photograph. They are muted, looping and decorative, so
      # they are re-cut here at a phone's real pixel count with the audio track
      # dropped. The landscape masters are untouched.
      # The first cut left them at 1.2MB and 2.0MB, still three megabytes of
      # motion behind the words. They sit behind a scrim and under text, at 640
      # across on a screen that is 390 points wide, so the grain they are losing
      # here is grain nobody was going to read through a dark overlay.
      - name: The loops, cut for a phone
        run: |
          set -e
          # The hero loop sits behind a scrim: 640 across, but no longer crushed
          # (crf 30, about 1.1MB). The stone loop is the picture itself and is
          # only fetched when it is reached: 720 across, about 2.1MB. Both are
          # cut from the 1080x1936 masters, so the extra detail is real.
          for spec in "hero-loop-v 640 30" "inside-v 720 30"; do
            set -- $spec; v=$1; W=$2; Q=$3
            [ -f "dist/v/$v.mp4" ] || continue
            before=$(stat -c%s "dist/v/$v.mp4")
            ffmpeg -nostdin -v error -i "dist/v/$v.mp4" -an               -vf "scale='min($W,iw)':-2:flags=lanczos"               -c:v libx264 -preset slow -crf $Q -profile:v high -pix_fmt yuv420p               -movflags +faststart "dist/v/$v.tmp.mp4" -y
            after=$(stat -c%s "dist/v/$v.tmp.mp4")
            if [ "$after" -gt 0 ] && [ "$after" -lt "$before" ]; then
              mv "dist/v/$v.tmp.mp4" "dist/v/$v.mp4"
              echo "$v: $((before/1024))KB -> $((after/1024))KB"
            else
              rm -f "dist/v/$v.tmp.mp4"; echo "$v: left alone ($((before/1024))KB)"
            fi
          done
      # The piece films (SOUL, ICON, MOMENT): three takes joined with crossfades into one loop, plus a
      # phone cut and the poster. If the generation host is down, what shipped
      # last time is taken from the live site.
      - name: The piece films
        run: |
          if ! bash lumera/site/film-assets.sh dist; then
            LIVE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
            mkdir -p dist/v dist/img
            for n in soul icon moment; do
              curl -fsSL --retry 3 -o dist/v/$n-film.mp4 "$LIVE/v/$n-film.mp4" || echo "missing: $n-film"
              curl -fsSL --retry 3 -o dist/v/$n-film-720.mp4 "$LIVE/v/$n-film-720.mp4" || echo "missing: $n-film-720"
              curl -fsSL --retry 3 -o dist/img/$n-film-poster.jpg "$LIVE/img/$n-film-poster.jpg" || echo "missing: $n-film-poster"
            done
          fi
      - name: Wrist photographs
        run: bash lumera/site/wrist-assets.sh dist/img
      - name: Collection photography (committed originals)
        run: bash lumera/site/piece-assets.sh dist/img
      - name: The box sequence, cut from the 4K restoration
        run: bash lumera/site/box-frames.sh dist/f/box
      # The desk under "Light goes in. Fire comes out.": leather and loose
      # stones. It is decoration, so a missing host does not stop the deploy:
      # what shipped last time is taken from the live site instead, and with
      # neither, the page shows the plain black and the words.
      - name: The diamond desk (leather and stones)
        run: |
          pip install --quiet pillow
          if ! python3 lumera/site/desk-assets.py dist/desk; then
            LIVE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
            mkdir -p dist/desk
            for f in round oval pear marquise emerald princess baguette link; do curl -fsSL --retry 3 -o "dist/desk/$f-512.webp" "$LIVE/desk/$f-512.webp" || echo "missing: desk/$f-512.webp"; done
            for f in leather-1600 leather-2560 leather-3840 leather-v-1080; do curl -fsSL --retry 3 -o "dist/desk/$f.jpg" "$LIVE/desk/$f.jpg" || echo "missing: desk/$f.jpg"; done
          fi
      # pictures and films the owner uploaded in the admin and that this release uses
      - name: Library media
        run: bash lumera/site/library-assets.sh dist
      # the admin: its own bundle at /admin/, never loaded by the storefront
      - name: The admin
        run: |
          npm ci --prefix lumera/admin --no-audit --no-fund
          SILAVU_SITE_URL="$SILAVU_LIVE/" node lumera/admin/build.mjs dist/admin
      # The cards are built in the browser from the catalogue, so a missing
      # derivative is invisible to anything that only reads the HTML. This
      # reads the catalogue, works out every file the page can ask for, and
      # fails the build if one is not on disk. It is here because it once was
      # not: a glob skipped two of the three pieces and the bracelet and the
      # ring went live with no photography at any width, green all the way.
      - name: Every photograph the page asks for
        run: node lumera/site/check-assets.mjs dist
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # the admin shows whether a publish is live; the build says so when it has finished either way
  report:
    needs: [build, deploy]
    if: always() && needs.build.outputs.release != ''
    runs-on: ubuntu-latest
    steps:
      - name: Report the result
        if: env.SILAVU_BUILD_TOKEN != ''
        run: |
          st=failed; [ "${{ needs.deploy.result }}" = "success" ] && st=live
          curl -fsS -X POST "$SILAVU_FUNCTIONS_URL/release-status" -H "authorization: Bearer $SILAVU_BUILD_TOKEN" -H "content-type: application/json" \
            -d "{\"release\": ${{ needs.build.outputs.release }}, \"status\": \"$st\", \"url\": \"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\", \"error\": \"build ${{ needs.build.result }}, deploy ${{ needs.deploy.result }}\"}"
