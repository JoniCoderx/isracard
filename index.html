<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>OPERATION: BLACKSITE</title>
<style>
  :root { --spread: 6px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05070a; }
  body { font-family: "Segoe UI", system-ui, Arial, sans-serif; color: #e8eef5; cursor: default; user-select: none; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .hidden { display: none !important; }

  /* Crosshair */
  #crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  #crosshair i {
    position: absolute; background: rgba(230,245,255,.9);
    box-shadow: 0 0 4px rgba(0,0,0,.9); border-radius: 1px;
    transition: transform .06s ease-out, opacity .12s;
  }
  #crosshair .dot { width: 2px; height: 2px; left: -1px; top: -1px; border-radius: 50%; }
  #crosshair .l { width: 2px; height: 8px; left: -1px; }
  #crosshair .h { height: 2px; width: 8px; top: -1px; }
  #crosshair .up    { transform: translateY(calc(-1 * var(--spread) - 8px)); }
  #crosshair .down  { transform: translateY(var(--spread)); }
  #crosshair .left  { transform: translateX(calc(-1 * var(--spread) - 8px)); }
  #crosshair .right { transform: translateX(var(--spread)); }

  /* Hitmarker */
  #hitmarker { position: absolute; left: 50%; top: 50%; width: 0; height: 0; opacity: 0; }
  #hitmarker i { position: absolute; width: 10px; height: 2px; background: #fff; box-shadow: 0 0 4px #000; }
  #hitmarker .a { transform: rotate(45deg) translateX(6px); }
  #hitmarker .b { transform: rotate(45deg) translateX(-16px); }
  #hitmarker .c { transform: rotate(-45deg) translateX(6px); }
  #hitmarker .d { transform: rotate(-45deg) translateX(-16px); }
  #hitmarker.kill i { background: #ff5252; box-shadow: 0 0 6px #900; }

  /* Bottom bars */
  .hud-cluster { position: absolute; bottom: 34px; display: flex; align-items: flex-end; gap: 14px;
    text-shadow: 0 2px 6px rgba(0,0,0,.9); }
  #left-cluster { left: 40px; }
  #right-cluster { right: 40px; flex-direction: row-reverse; }
  .stat-label { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; opacity: .6; margin-bottom: 3px; }
  .health-wrap { width: 260px; }
  .health-track { height: 10px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
    border-radius: 2px; overflow: hidden; }
  #health-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #16d67a, #7dffb0);
    box-shadow: 0 0 12px rgba(22,214,122,.5); transition: width .18s ease, background .25s; }
  #health-num { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 1px; }

  #ammo { text-align: right; font-variant-numeric: tabular-nums; line-height: 1; }
  #ammo .cur { font-size: 46px; font-weight: 800; letter-spacing: 1px; }
  #ammo .sep { font-size: 26px; opacity: .5; margin: 0 4px; }
  #ammo .res { font-size: 26px; opacity: .75; }
  #ammo .wname { font-size: 12px; letter-spacing: 3px; opacity: .7; text-transform: uppercase; }
  #ammo.low .cur { color: #ff5959; text-shadow: 0 0 10px rgba(255,60,60,.6); }

  /* Top status */
  #topbar { position: absolute; top: 26px; left: 0; right: 0; display: flex; justify-content: center; gap: 60px;
    text-align: center; text-shadow: 0 2px 6px rgba(0,0,0,.9); }
  .topstat b { display: block; font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .topstat span { font-size: 10px; letter-spacing: 3px; opacity: .55; text-transform: uppercase; }

  /* Center announce */
  #announce { position: absolute; left: 0; right: 0; top: 30%; text-align: center; opacity: 0;
    transition: opacity .3s; }
  #announce .big { font-size: 54px; font-weight: 900; letter-spacing: 6px;
    text-shadow: 0 4px 24px rgba(0,0,0,.9); }
  #announce .sub { font-size: 16px; letter-spacing: 5px; opacity: .7; margin-top: 6px; }

  /* Damage vignette */
  #vignette { position: absolute; inset: 0; pointer-events: none; opacity: 0;
    box-shadow: inset 0 0 220px 60px rgba(200,10,10,.85); transition: opacity .25s; }
  #dir-dmg { position: absolute; inset: 0; }
  .dmg-arc { position: absolute; left: 50%; top: 50%; width: 130px; height: 130px; margin: -65px 0 0 -65px;
    opacity: 0; transition: opacity .4s; }
  .dmg-arc::before { content: ""; position: absolute; left: 50%; top: -6px; width: 46px; height: 10px;
    margin-left: -23px; background: linear-gradient(#ff3b3b, transparent); clip-path: polygon(50% 0,100% 100%,0 100%); }

  #lowhp { position: absolute; inset: 0; pointer-events: none; opacity: 0;
    box-shadow: inset 0 0 160px 30px rgba(180,0,0,.6); transition: opacity .4s; }

  /* Kill feed */
  #killfeed { position: absolute; top: 90px; right: 40px; text-align: right; font-size: 13px; }
  #killfeed div { opacity: 0; animation: kf 3.2s forwards; letter-spacing: 1px; margin-bottom: 4px;
    text-shadow: 0 2px 5px #000; }
  #killfeed b { color: #ff6b6b; }
  @keyframes kf { 0%{opacity:0; transform:translateX(20px)} 8%{opacity:1; transform:none} 80%{opacity:1} 100%{opacity:0} }

  /* Menus */
  .screen { position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(ellipse at center, rgba(8,12,18,.72), rgba(3,5,8,.94)); }
  .title { font-size: 76px; font-weight: 900; letter-spacing: 10px; line-height: .95;
    background: linear-gradient(180deg,#fff,#8fb2cf); -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 8px 40px rgba(0,0,0,.6); }
  .subtitle { font-size: 15px; letter-spacing: 9px; opacity: .55; margin: 10px 0 40px; text-transform: uppercase; }
  .btn { pointer-events: auto; cursor: pointer; font: inherit; font-weight: 700; letter-spacing: 3px;
    text-transform: uppercase; color: #05070a; background: linear-gradient(180deg,#e9f3ff,#a9c8e6);
    border: none; padding: 15px 46px; border-radius: 3px; font-size: 15px;
    box-shadow: 0 10px 30px rgba(120,170,220,.3); transition: transform .12s, box-shadow .12s; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(120,170,220,.45); }
  .controls { margin-top: 34px; font-size: 13px; letter-spacing: 1px; opacity: .6; line-height: 2; }
  .controls kbd { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2);
    border-radius: 3px; padding: 1px 7px; font-family: inherit; margin: 0 2px; }
  #loading { position: absolute; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
    background: #05070a; letter-spacing: 6px; font-size: 14px; opacity: .8; }
  #loading .bar { position: absolute; bottom: 0; left: 0; height: 3px; width: 0%;
    background: linear-gradient(90deg,#16d67a,#7dffb0); transition: width .3s; }
  .fade { transition: opacity .5s; }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud" class="hidden">
  <div id="crosshair">
    <i class="dot"></i>
    <i class="l up"></i><i class="l down"></i><i class="h left"></i><i class="h right"></i>
  </div>
  <div id="hitmarker"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i></div>

  <div id="topbar">
    <div class="topstat"><b id="wave-num">1</b><span>Wave</span></div>
    <div class="topstat"><b id="kills-num">0</b><span>Eliminations</span></div>
    <div class="topstat"><b id="enemies-num">0</b><span>Hostiles</span></div>
  </div>

  <div id="left-cluster" class="hud-cluster">
    <div class="health-wrap">
      <div class="stat-label">Vitals</div>
      <div class="health-track"><div id="health-fill"></div></div>
    </div>
    <div id="health-num">100</div>
  </div>

  <div id="right-cluster" class="hud-cluster">
    <div id="ammo">
      <div class="wname" id="weapon-name">MK-7 CARBINE</div>
      <span class="cur" id="ammo-cur">30</span><span class="sep">/</span><span class="res" id="ammo-res">120</span>
    </div>
  </div>

  <div id="killfeed"></div>
  <div id="announce"><div class="big" id="announce-big"></div><div class="sub" id="announce-sub"></div></div>
  <div id="dir-dmg"></div>
  <div id="vignette"></div>
  <div id="lowhp"></div>
</div>

<div id="menu" class="screen">
  <div class="title">OPERATION<br>BLACKSITE</div>
  <div class="subtitle">Tactical Survival</div>
  <button class="btn" id="start-btn">Deploy</button>
  <div class="controls">
    <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move &nbsp;·&nbsp; <kbd>Shift</kbd> Sprint &nbsp;·&nbsp; <kbd>Space</kbd> Jump &nbsp;·&nbsp; <kbd>Ctrl</kbd> Crouch</div>
    <div><kbd>Mouse</kbd> Aim &nbsp;·&nbsp; <kbd>Left</kbd> Fire &nbsp;·&nbsp; <kbd>Right</kbd> ADS &nbsp;·&nbsp; <kbd>R</kbd> Reload &nbsp;·&nbsp; <kbd>Esc</kbd> Pause</div>
  </div>
</div>

<div id="pause" class="screen hidden">
  <div class="title" style="font-size:52px">PAUSED</div>
  <button class="btn" id="resume-btn" style="margin-top:30px">Resume</button>
</div>

<div id="gameover" class="screen hidden">
  <div class="title" style="font-size:60px;background:linear-gradient(180deg,#ff8a8a,#7a2b2b);-webkit-background-clip:text;background-clip:text;">K.I.A.</div>
  <div class="subtitle" id="go-stats">Wave 1 · 0 Eliminations</div>
  <button class="btn" id="retry-btn">Redeploy</button>
</div>

<div id="loading">INITIALIZING BLACKSITE<div class="bar" id="loadbar"></div></div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
