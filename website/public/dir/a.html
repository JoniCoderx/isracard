<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>SILAVU — A · Editorial</title>
<style>
@font-face{font-family:"Jost";font-weight:300 600;font-display:swap;src:url("../fonts/jost-normal-latin-b58a58.woff2") format("woff2")}
@font-face{font-family:"Cormorant";font-weight:300 700;font-display:swap;src:url("../fonts/cormorant-normal-latin-d80df8.woff2") format("woff2")}
@font-face{font-family:"Cormorant";font-style:italic;font-weight:300 700;font-display:swap;src:url("../fonts/cormorant-italic-latin-6f2f5c.woff2") format("woff2")}
*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;-webkit-font-smoothing:antialiased}img,video{display:block;max-width:100%}a{color:inherit}p,h1,h2,h3{margin:0}
:root{--sans:"Jost","Helvetica Neue",Arial,sans-serif;--serif:"Cormorant",Georgia,serif;--gut:clamp(18px,3.6vw,60px)}
.dirtag{position:fixed;z-index:50;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:999px;background:rgba(17,17,17,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font:500 11px/1 var(--sans);letter-spacing:.12em}
.dirtag a{color:#fff;text-decoration:none;padding:8px 12px;border-radius:999px;opacity:.7}.dirtag a.on{background:#fff;color:#111;opacity:1}


body{background:#fbfaf8;color:#141414;font:400 15px/1.6 var(--sans)}
.top{display:flex;justify-content:space-between;align-items:center;padding:22px var(--gut);border-bottom:1px solid #e7e4df}
.brand{font:500 15px/1 var(--sans);letter-spacing:.5em;text-decoration:none}
.nav{display:flex;gap:28px;font:500 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase}.nav a{text-decoration:none}
.hero{display:grid;grid-template-columns:1.05fr 1fr;min-height:calc(100svh - 61px)}
.hero__words{display:flex;flex-direction:column;justify-content:space-between;padding:clamp(28px,5vw,72px) var(--gut);border-right:1px solid #e7e4df}
.issue{display:flex;justify-content:space-between;font:500 11px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:#77736d}
.hero h1{font:300 clamp(5rem,13.5vw,15rem)/.82 var(--serif);letter-spacing:-.035em;margin:40px 0}
.hero h1 i{display:block;font-style:italic;padding-left:.55em;color:#8a7a62}
.hero__foot{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}
.hero__foot p{max-width:34ch;color:#3d3a36}
.btn{display:inline-block;padding:17px 28px;background:#141414;color:#fbfaf8;text-decoration:none;font:500 11px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase}
.hero__pic{position:relative;overflow:hidden}.hero__pic img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.hero__pic figcaption{position:absolute;left:20px;bottom:18px;font:500 10px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:#fff}
.sel{padding:clamp(56px,9vw,130px) var(--gut)}
.sel__head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #141414;padding-bottom:16px;margin-bottom:28px}
.sel__head h2{font:300 clamp(2.4rem,5vw,4.4rem)/1 var(--serif);letter-spacing:-.02em}.sel__head span{font:500 11px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:#77736d}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,2vw,28px)}
.card img{aspect-ratio:4/5;width:100%;object-fit:cover;background:#f0eeea}
.card div{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px}
.card b{font:400 1.6rem/1 var(--serif)}.card span{font:500 10px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:#77736d}
.card:nth-child(2){margin-top:clamp(40px,8vw,120px)}
@media (max-width:760px){
 .nav a:not(:last-child){display:none}
 .hero{grid-template-columns:1fr}.hero__words{border:0;order:2;padding-top:22px;padding-bottom:40px}.hero__pic{height:62svh}
 .hero h1{font-size:clamp(4.6rem,24vw,7rem);margin:18px 0 22px}.hero__foot{grid-template-columns:1fr}.issue{order:-1}
 .grid{grid-template-columns:1fr 1fr}.card:nth-child(2){margin-top:44px}.card:nth-child(3){display:none}
}
</style>
</head>
<body>
<header class="top"><a class="brand" href="#">SILAVU</a><nav class="nav"><a href="#">Collection</a><a href="#">The house</a><a href="mailto:concierge@silavu.com?subject=A%20private%20viewing">Appointment</a></nav></header>
<main>
<section class="hero">
  <div class="hero__words">
    <p class="issue"><span>Collection N°1</span><span>Tel Aviv · Dubai</span></p>
    <h1>Made to <i>catch</i> the light</h1>
    <div class="hero__foot"><p>Seven creations in 18K gold and hand-matched diamonds, each carrying the SILAVU knot.</p><a class="btn" href="#">Book a viewing</a></div>
  </div>
  <figure class="hero__pic" style="margin:0"><img src="../models/necklace-1400.jpg" alt="SOUL, the pavé knot necklace, worn" /><figcaption>Soul · Diamond necklace</figcaption></figure>
</section>
<section class="sel">
  <div class="sel__head"><h2>The pieces</h2><span>07 creations</span></div>
  <div class="grid">
    <a class="card" href="#" style="text-decoration:none"><img src="../img/p/aura-worn-900.jpg" alt="" loading="lazy" /><div><b>Aura</b><span>Earrings</span></div></a>
    <a class="card" href="#" style="text-decoration:none"><img src="../models/ring-900.jpg" alt="" loading="lazy" /><div><b>Icon</b><span>Ring</span></div></a>
    <a class="card" href="#" style="text-decoration:none"><img src="../img/p/knot-worn-900.jpg" alt="" loading="lazy" /><div><b>Moment</b><span>Bracelet</span></div></a>
  </div>
</section>
</main>
<nav class="dirtag" aria-label="Directions"><a href="index.html">ALL</a><a href="a.html" class="on">A</a><a href="b.html" class="">B</a><a href="c.html" class="">C</a><a href="d.html" class="">D</a></nav>
</body>
</html>
