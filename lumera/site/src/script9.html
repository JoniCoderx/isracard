<script>
/* The Line, drawn. A tennis bracelet built from nothing as the page moves:
   a hairline guide, then every brilliant drawn facet by facet — girdle,
   table, stars, kites, upper girdle — with its prongs and links; then the
   facets take their light and the metal its polish; then it sparkles.
   Everything is drawn from geometry at the screen's own resolution, so it is
   as sharp on a 5K display as on a phone, and weighs nothing to download. */
(function () {
  "use strict";
  var pin = document.getElementById("drawpin"), cv = document.getElementById("drawcv");
  if (!pin || !cv) return;
  var ctx = cv.getContext("2d"); if (!ctx) return;
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var caps = [].slice.call(pin.querySelectorAll(".dc")), bar = document.getElementById("drawbar"), go = pin.querySelector(".dgo");
  var W = 0, H = 0, DPR = 1, stones = [], R = 40, seed = 7;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  function c01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function ease(x) { x = c01(x); return x * x * (3 - 2 * x); }

  /* one brilliant, top view, in unit radius: its edges (for the drawing) and
     its 33 facets (for the light) */
  var P = function (a, r) { return [Math.cos(a) * r, Math.sin(a) * r]; }, D = Math.PI / 180;
  var G = [], T = [], S = [], i;
  for (i = 0; i < 16; i++) G.push(P(i * 22.5 * D, 1));
  for (i = 0; i < 8; i++) { T.push(P((i * 45 + 22.5) * D, 0.56)); S.push(P(i * 45 * D, 0.80)); }
  var EDGES = [], FACETS = [];
  for (i = 0; i < 48; i++) EDGES.push([P(i * 7.5 * D, 1), P((i + 1) * 7.5 * D, 1), 0]);            /* girdle */
  for (i = 0; i < 8; i++) EDGES.push([T[i], T[(i + 1) % 8], 1]);                                    /* table */
  for (i = 0; i < 8; i++) { EDGES.push([T[(i + 7) % 8], S[i], 2]); EDGES.push([S[i], T[i], 2]); }   /* stars */
  for (i = 0; i < 8; i++) EDGES.push([T[i], G[2 * i + 1], 3]);                                      /* kites */
  for (i = 0; i < 8; i++) { EDGES.push([S[i], G[(2 * i + 15) % 16], 4]); EDGES.push([S[i], G[2 * i], 4]); EDGES.push([S[i], G[2 * i + 1], 4]); } /* upper girdle */
  FACETS.push({ p: T.slice(), t: 0 });
  for (i = 0; i < 8; i++) FACETS.push({ p: [T[(i + 7) % 8], S[i], T[i]], t: 1 });
  for (i = 0; i < 8; i++) FACETS.push({ p: [T[i], S[i], G[2 * i + 1], S[(i + 1) % 8]], t: 2 });
  for (i = 0; i < 8; i++) { FACETS.push({ p: [S[i], G[(2 * i + 15) % 16], G[2 * i]], t: 3 }); FACETS.push({ p: [S[i], G[2 * i], G[2 * i + 1]], t: 3 }); }
  var ELEN = EDGES.map(function (e) { return Math.hypot(e[1][0] - e[0][0], e[1][1] - e[0][1]); }), ETOT = ELEN.reduce(function (a, b) { return a + b; }, 0);
  FACETS.forEach(function (f, k) { f.ph = rnd() * 6.283; f.k = 0.6 + rnd() * 2.4; f.base = f.t === 0 ? 0.30 : 0.02 + rnd() * 0.16; });

  /* the line: a long, gentle curve across the frame, the way a bracelet lies
     when it is set down — stones follow it, turned to its direction */
  function layout() {
    var r = pin.querySelector(".drawin").getBoundingClientRect();
    DPR = Math.min(devicePixelRatio || 1, 2); W = Math.round(r.width * DPR); H = Math.round(r.height * DPR);
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
    var portrait = H > W, n = portrait ? 5.2 : 14;
    R = Math.min(W / (n * 2.3), H * (portrait ? 0.075 : 0.085));
    stones = []; seed = 11;
    var x0 = -R * 1.4, x1 = W + R * 1.4, cy = H * (portrait ? 0.40 : 0.42), amp = H * (portrait ? 0.05 : 0.11);
    var y = function (x) { var u = x / W; return cy + Math.sin(u * Math.PI * 1.15 - 0.35) * amp - (u - 0.5) * amp * 0.5; };
    /* walk along the curve at equal arc length, so the stones sit shoulder to shoulder */
    var pts = [], L = 0, px = x0, py = y(x0), steps = 900;
    for (i = 0; i <= steps; i++) { var x = x0 + (x1 - x0) * i / steps, yy = y(x); L += Math.hypot(x - px, yy - py); pts.push([x, yy, L]); px = x; py = yy; }
    var gap = R * 2.18, cnt = Math.floor(L / gap), off = (L - cnt * gap) / 2, j = 0;
    for (i = 0; i <= cnt; i++) {
      var at = off + i * gap; while (j < pts.length - 2 && pts[j + 1][2] < at) j++;
      var a = pts[j], b2 = pts[j + 1], f = (at - a[2]) / Math.max(1e-6, b2[2] - a[2]);
      var sx = a[0] + (b2[0] - a[0]) * f, sy = a[1] + (b2[1] - a[1]) * f, ang = Math.atan2(b2[1] - a[1], b2[0] - a[0]);
      stones.push({ x: sx, y: sy, a: ang, rot: rnd() * 0.4, lit: rnd() * 6.283 });
    }
    guide = pts; guideL = L;
  }
  var guide = [], guideL = 1;

  function tr(s, q) { var c = Math.cos(s.a + s.rot), sn = Math.sin(s.a + s.rot); return [s.x + (q[0] * c - q[1] * sn) * R, s.y + (q[0] * sn + q[1] * c) * R]; }
  function trm(s, q) { var c = Math.cos(s.a), sn = Math.sin(s.a); return [s.x + (q[0] * c - q[1] * sn) * R, s.y + (q[0] * sn + q[1] * c) * R]; }

  var P0 = -1, T0 = 0;
  function draw(p, t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    var n = stones.length, lw = Math.max(1, DPR * 0.9);
    /* stage one, 0 → .12: the guide, a single hairline across the frame */
    var g = ease(p / 0.12), gf = 1 - ease((p - 0.42) / 0.2);
    if (g > 0 && gf > 0) {
      ctx.strokeStyle = "rgba(255,255,255," + (0.5 * gf).toFixed(3) + ")"; ctx.lineWidth = lw * 0.8; ctx.setLineDash([6 * DPR, 7 * DPR]);
      ctx.beginPath(); var lim = guideL * g;
      for (i = 0; i < guide.length && guide[i][2] <= lim; i++) { if (i === 0) ctx.moveTo(guide[i][0], guide[i][1]); else ctx.lineTo(guide[i][0], guide[i][1]); }
      ctx.stroke(); ctx.setLineDash([]);
    }
    /* stage three, .52 → .80: the light arrives — facets fill, the metal takes its polish */
    /* line → geometry → metal → stones → finished: the metal is formed
       first, the stones are set into it, and only then does it catch light */
    var metalF = ease((p - 0.46) / 0.16), fill = ease((p - 0.60) / 0.18), spark = ease((p - 0.80) / 0.16);
    var light = p * 9 + t * 0.00045;
    for (var k = 0; k < n; k++) {
      var s = stones[k];
      /* stage two, .08 → .56: each stone drawn in turn, overlapping the next */
      var d0 = 0.08 + (k / n) * 0.36, dp = c01((p - d0) / 0.14);
      /* links between this stone and the next, under everything */
      if (k < n - 1 && dp > 0.6) {
        var s2 = stones[k + 1], la = ease((dp - 0.6) / 0.4);
        var m1 = trm(s, [0.98, 0]), m2 = trm(s2, [-0.98, 0]);
        ctx.strokeStyle = metalF > 0 ? mixMetal(metalF, 0.9) : "rgba(255,255,255," + (0.7 * la).toFixed(3) + ")";
        ctx.lineWidth = R * (0.10 + metalF * 0.08); ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(m1[0], m1[1]); ctx.lineTo(m1[0] + (m2[0] - m1[0]) * la, m1[1] + (m2[1] - m1[1]) * la); ctx.stroke();
      }
      var ma = ease((metalF * 1.4) - (k / n) * 0.4);
      if (ma > 0) {
        /* the basket, formed in metal before any stone is in it */
        var gr = ctx.createRadialGradient(s.x - R * 0.3, s.y - R * 0.3, R * 0.2, s.x, s.y, R * 1.12);
        gr.addColorStop(0, "rgba(245,247,250," + ma + ")"); gr.addColorStop(0.7, "rgba(150,156,164," + ma + ")"); gr.addColorStop(1, "rgba(60,62,66," + ma + ")");
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(s.x, s.y, R * 1.1, 0, 6.283); ctx.fill();
        ctx.fillStyle = "rgba(0,0,0," + (ma * (1 - ease((fill * 1.4) - (k / n) * 0.4)) * 0.92).toFixed(3) + ")"; ctx.beginPath(); ctx.arc(s.x, s.y, R * 0.98, 0, 6.283); ctx.fill();
      }
      if (fill > 0) {
        var fa = ease((fill * 1.4) - (k / n) * 0.4);
        if (fa > 0) {
          /* the facets: each one its own mirror, turning bright or dark as the light moves */
          FACETS.forEach(function (f, fi) {
            var v = f.base + (1 - f.base) * Math.pow(0.5 + 0.5 * Math.sin(f.ph + s.lit + light * f.k), 4.5);
            if (f.t === 0) v = 0.22 + 0.5 * Math.pow(0.5 + 0.5 * Math.sin(s.lit + light * 0.7), 2);
            var c = Math.round(8 + v * 247);
            ctx.fillStyle = "rgba(" + c + "," + c + "," + Math.min(255, c + 6) + "," + fa + ")";
            ctx.beginPath(); for (var q = 0; q < f.p.length; q++) { var pt = tr(s, f.p[q]); if (q === 0) ctx.moveTo(pt[0], pt[1]); else ctx.lineTo(pt[0], pt[1]); } ctx.closePath(); ctx.fill();
          });
        }
      }
      /* the drawing itself: every edge, in order, up to how far this stone has got */
      if (dp > 0) {
        var want = ETOT * ease(dp), acc = 0, alpha = 0.92 * (1 - fill * 0.7);
        ctx.strokeStyle = "rgba(255,255,255," + alpha.toFixed(3) + ")"; ctx.lineWidth = lw * (1 - fill * 0.4); ctx.lineCap = "round";
        ctx.beginPath();
        for (var e = 0; e < EDGES.length && acc < want; e++) {
          var E = EDGES[e], L2 = ELEN[e], u = Math.min(1, (want - acc) / L2), A = tr(s, E[0]), B = tr(s, E[1]);
          ctx.moveTo(A[0], A[1]); ctx.lineTo(A[0] + (B[0] - A[0]) * u, A[1] + (B[1] - A[1]) * u); acc += L2;
        }
        ctx.stroke();
        /* four prongs at the corners of the basket */
        var pa = ease((dp - 0.75) / 0.25);
        if (pa > 0) for (var pr = 0; pr < 4; pr++) {
          var ang = (pr * 90 + 45) * D, c2 = trm(s, [Math.cos(ang) * 1.02, Math.sin(ang) * 1.02]);
          ctx.beginPath(); ctx.arc(c2[0], c2[1], R * 0.13 * pa, 0, 6.283);
          if (metalF > 0) { ctx.fillStyle = mixMetal(metalF, 1); ctx.fill(); }
          ctx.strokeStyle = "rgba(255,255,255," + (0.85 * (1 - fill * 0.6)).toFixed(3) + ")"; ctx.lineWidth = lw; ctx.stroke();
        }
      }
    }
    /* stage four, .74 → 1: it sparkles — four-point glints and the odd flash of fire */
    if (spark > 0) {
      ctx.globalCompositeOperation = "lighter";
      for (k = 0; k < n; k++) {
        var st = stones[k];
        for (var m = 0; m < 2; m++) {
          var ph = Math.sin(st.lit * 3.1 + m * 2.2 + t * 0.0021 * (1 + m * 0.6) + p * 14);
          var a2 = Math.pow(c01(ph), 8) * spark; if (a2 < 0.02) continue;
          var ga = st.lit + m * 2.4, gx = st.x + Math.cos(ga) * R * 0.45, gy = st.y + Math.sin(ga) * R * 0.45, len = R * (0.9 + m * 0.5) * a2;
          var fire = "rgba(255,255,255,"; len *= 0.6;
          ctx.strokeStyle = fire + (0.95 * a2).toFixed(3) + ")"; ctx.lineWidth = lw * 1.2;
          ctx.beginPath(); ctx.moveTo(gx - len, gy); ctx.lineTo(gx + len, gy); ctx.moveTo(gx, gy - len); ctx.lineTo(gx, gy + len); ctx.stroke();
          var rg = ctx.createRadialGradient(gx, gy, 0, gx, gy, R * 0.5 * a2 + 1);
          rg.addColorStop(0, fire + (0.9 * a2).toFixed(3) + ")"); rg.addColorStop(1, fire + "0)");
          ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(gx, gy, R * 0.5 * a2 + 1, 0, 6.283); ctx.fill();
        }
      }
      ctx.globalCompositeOperation = "source-over";
    }
  }
  function mixMetal(f, a) { var c = Math.round(120 + f * 110); return "rgba(" + c + "," + (c + 3) + "," + (c + 8) + "," + a + ")"; }

  /* the drawing starts as the chapter comes up the screen, not once it has
     filled it, so nobody scrolls through a black frame waiting for the line */
  function progress() { var r = pin.getBoundingClientRect(), lead = innerHeight * 0.75, span = r.height - innerHeight + lead; return span > 0 ? c01((lead - r.top) / span) : 0; }
  var capAt = -1;
  function captions(p) {
    var c = p < 0.30 ? 0 : p < 0.50 ? 1 : p < 0.66 ? 2 : 3;
    if (c !== capAt) { capAt = c; caps.forEach(function (el, k) { el.classList.toggle("on", k === c); }); }
    if (go) go.classList.toggle("on", p > 0.86);
    if (bar) bar.style.transform = "scaleX(" + p.toFixed(4) + ")";
  }
  function tick(t) {
    requestAnimationFrame(tick);
    var r = pin.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return;
    var p = reduce ? 1 : progress();
    /* once the light has come it keeps moving on its own; before that the
       frame only changes when the page does */
    if (p === P0 && (p < 0.80 || reduce)) return;
    P0 = p; draw(p, reduce ? 0 : t); captions(p);
  }
  layout(); addEventListener("resize", function () { layout(); P0 = -1; });
  requestAnimationFrame(tick);
})();
</script>
