<script>
/* The signature. The section holds while the page moves, and one line of
   light comes in from the left edge of the screen and writes SILAVU without
   lifting: the S from its rising stroke and top loop, the swash under it
   into the i, the loop of the l, the a, the v, the u and the long rising
   finish. A small point of light travels with the end of the line. As it
   finishes, four points catch, briefly (the dot of the i stays), and the two
   lines arrive under the name. Scrubbed to the scroll, softly; only dash
   offsets, transforms and opacity change. With reduced motion, the written
   name and its words, and no hold. */
(function () {
  "use strict";
  var sec = document.getElementById("craft"); if (!sec) return;
  var stage = sec.querySelector(".sgstage"), svg = sec.querySelector(".sgsvg"), path = sec.querySelector(".sgpath"),
      halo = sec.querySelector(".sghalo"), pen = sec.querySelector(".sgpen"), dot = sec.querySelector(".sgdot"),
      sparks = [].slice.call(sec.querySelectorAll(".sgspark > g")), sparkG = sec.querySelector(".sgspark"),
      c1 = sec.querySelector(".sgc1"), c2 = sec.querySelector(".sgc2");
  if (!stage || !svg || !path) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  sec.classList.add("sgjs");

  var L = path.getTotalLength(), L0 = 0, Li = 0, scale = 1, p = -1, last = -2, dirty = true;
  function c01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function sm(a, b, x) { x = c01((x - a) / (b - a)); return x * x * (3 - 2 * x); }
  /* a hand writes at an even pace, easing only at the start and the finish */
  function write(a, b, x) { x = c01((x - a) / (b - a)); var e = 0.12;
    return x < e ? x * x / (2 * e) / (1 - e) : x > 1 - e ? 1 - (1 - x) * (1 - x) / (2 * e) / (1 - e) : (x - e / 2) / (1 - e); }

  path.style.strokeDasharray = halo.style.strokeDasharray = L + " " + (L + 2);

  function measure() {
    var m = svg.getScreenCTM(); scale = m ? m.a : 1;
    /* a fine line at any size: about 1.5px on screen, its halo a little wider */
    path.style.strokeWidth = (1.5 / scale).toFixed(2);
    halo.style.strokeWidth = (6 / scale).toFixed(2);
    dot.setAttribute("r", (2.6 / scale).toFixed(2));
    /* the line enters at the left edge of the screen: start from there, so no
       scroll is spent drawing what nobody can see */
    var sr = stage.getBoundingClientRect(), lo = 0, hi = L * 0.4;
    for (var k = 0; k < 18; k++) { var mid = (lo + hi) / 2, pt = path.getPointAtLength(mid);
      if (m.a * pt.x + m.e < sr.left - 4) lo = mid; else hi = mid; }
    L0 = lo;
    /* where the line reaches the top of the i, for its dot */
    lo = L0; hi = L;
    for (k = 0; k < 22; k++) { mid = (lo + hi) / 2; if (path.getPointAtLength(mid).x < 446) lo = mid; else hi = mid; }
    Li = lo;
    pen.firstElementChild.setAttribute("r", (14 / scale).toFixed(1));
    pen.lastElementChild.setAttribute("r", (1.6 / scale).toFixed(2));
    var ss = Math.min(1.25, Math.max(0.55, 1 / scale));
    sparks.forEach(function (g) { g.dataset.s = ss; });
    dirty = false; last = -2;
  }
  addEventListener("resize", function () { dirty = true; });

  function frame(q) {
    var w = write(0.04, 0.8, q), len = L0 + (L - L0) * w;
    path.style.strokeDashoffset = (L - len).toFixed(1);
    halo.style.strokeDashoffset = (L - len).toFixed(1);
    /* the point of light at the end of the line, while it writes */
    var writing = q > 0.02 && w < 1;
    if (writing) { var pt = path.getPointAtLength(len); pen.setAttribute("transform", "translate(" + pt.x.toFixed(1) + " " + pt.y.toFixed(1) + ")"); }
    pen.style.opacity = writing ? (sm(0.02, 0.06, q) * (1 - sm(0.76, 0.81, q))).toFixed(3) : "0";
    /* the dot of the i, placed as the line passes the top of the letter */
    var dp = c01((len - Li) / 260);
    dot.style.opacity = sm(0, 1, dp).toFixed(3);
    /* four points catch the light, one after another, and go again; the dot
       of the i keeps a little of it */
    sparkG.style.opacity = "1";
    sparks.forEach(function (g, i) {
      var a = 0.8 + i * 0.03, k = sm(a, a + 0.035, q) * (1 - sm(a + 0.05, a + 0.1, q) * (i === 0 ? 0.75 : 1)), s = +(g.dataset.s || 1);
      var base = g.getAttribute("data-t") || g.getAttribute("transform"); g.setAttribute("data-t", base);
      g.setAttribute("transform", base + " scale(" + (s * (0.35 + 0.65 * k)).toFixed(3) + ") rotate(" + (8 * k).toFixed(1) + ")");
      g.style.opacity = k.toFixed(3);
    });
    var a1 = sm(0.82, 0.92, q), a2 = sm(0.86, 0.96, q);
    c1.style.opacity = a1.toFixed(3); c1.style.transform = "translate3d(0," + (10 * (1 - a1)).toFixed(1) + "px,0)";
    c2.style.opacity = a2.toFixed(3); c2.style.transform = "translate3d(0," + (10 * (1 - a2)).toFixed(1) + "px,0)";
  }

  function tick() {
    requestAnimationFrame(tick);
    var r = sec.getBoundingClientRect(), vh = innerHeight;
    if (r.bottom < -60 || r.top > vh + 60) return;
    if (dirty) measure();
    var t = c01(-r.top / Math.max(1, r.height - vh));
    if (p < 0) p = t; else { p += (t - p) * 0.1; if (Math.abs(t - p) < 0.0003) p = t; }
    if (p === last) return; last = p;
    frame(p);
  }
  requestAnimationFrame(tick);
  window.__sig = { get p() { return p; } };
})();
</script>
