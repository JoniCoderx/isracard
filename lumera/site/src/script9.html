<script>
/* The signature. One line comes in from the left edge of the screen and
   writes SILAVU without lifting, then rises away to a point of light. The
   black above and the white below meet on one gentle diagonal through the
   name (drawn in body.mjs, in the name's own units): where the line crosses
   the black it is light metal, where it crosses the white it is dark ink.
   The two are the same path under two clips that share that one diagonal,
   so they meet edge to edge with nothing doubled and no seam.

   The writing follows the scroll and nothing else: how far the page has
   moved is how far the line has gone. It stops when the page stops, goes
   back when the page goes back, and there is no clock behind it. With
   reduced motion the name is simply there, written, on the same diagonal. */
(function () {
  "use strict";
  var sec = document.getElementById("craft"); if (!sec) return;
  var stage = sec.querySelector(".sgstage"), svg = sec.querySelector(".sgsvg");
  if (!stage || !svg) return;
  var Q = function (s) { return [].slice.call(sec.querySelectorAll(s)); };
  var path = sec.querySelector(".sglite .sgpath"), hairs = Q(".sgpath"), bodies = Q(".sgbody"), halo = sec.querySelector(".sghalo"),
      dots = Q(".sgdot"), pens = Q(".sgpen"), sparks = Q(".sgspark > g"), sparkG = sec.querySelector(".sgspark");
  if (!path) return;
  var lines = hairs.concat(bodies, halo ? [halo] : []);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  sec.classList.add("sgjs");

  var L = path.getTotalLength(), L0 = 0, Li = 0, scale = 1, last = -2, dirty = true;
  function c01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function sm(a, b, x) { x = c01((x - a) / (b - a)); return x * x * (3 - 2 * x); }
  /* a hand writes at an even pace, easing only as it starts and as it ends */
  function write(a, b, x) { x = c01((x - a) / (b - a)); var e = 0.1;
    return x < e ? x * x / (2 * e) / (1 - e) : x > 1 - e ? 1 - (1 - x) * (1 - x) / (2 * e) / (1 - e) : (x - e / 2) / (1 - e); }
  lines.forEach(function (e) { e.style.strokeDasharray = L + " " + (L + 2); e.style.strokeDashoffset = L; });

  /* where along the line it passes the top of the i, so its dot is placed
     as the line goes by. Found coarsely and then narrowed: a hundred and
     forty samples, where sixteen hundred once cost a phone four seconds. */
  function nearest(ax, ay) {
    var N = 96, best = 1e18, bl = 0, i, l, q, d;
    for (i = 0; i <= N; i++) { l = L * i / N; q = path.getPointAtLength(l); d = (q.x - ax) * (q.x - ax) + (q.y - ay) * (q.y - ay); if (d < best) { best = d; bl = l; } }
    var lo = Math.max(0, bl - L / N), hi = Math.min(L, bl + L / N);
    for (i = 0; i <= 40; i++) { l = lo + (hi - lo) * i / 40; q = path.getPointAtLength(l); d = (q.x - ax) * (q.x - ax) + (q.y - ay) * (q.y - ay); if (d < best) { best = d; bl = l; } }
    return bl;
  }

  function measure() {
    var m = svg.getScreenCTM(); scale = m ? m.a : 1;
    /* where the line passes the top of the i is a fixed point along this
       path (measured once: 3464.8 of 5861.2); searching for it took a
       hundred and forty path queries, a visible stall on a phone, at the
       very moment the name scrolled in. The search stays for a changed path. */
    if (!Li) Li = Math.abs(L - 5861.2) < 1 ? L * 0.591145 : nearest(457, 234);
    /* fine at any size: the hairline about 1.1px on screen, the metal 2.4px */
    hairs.forEach(function (e) { e.style.strokeWidth = (1.1 / scale).toFixed(2); });
    bodies.forEach(function (e) { e.style.strokeWidth = (2.4 / scale).toFixed(2); });
    if (halo) halo.style.strokeWidth = (7 / scale).toFixed(2);
    dots.forEach(function (d) { d.setAttribute("r", (2.5 / scale).toFixed(2)); });
    /* the line is drawn from where it enters the screen */
    var sr = stage.getBoundingClientRect(), lo = 0, hi = L * 0.5, k, mid, pt;
    for (k = 0; k < 13; k++) { mid = (lo + hi) / 2; pt = path.getPointAtLength(mid); if (m.a * pt.x + m.c * pt.y + m.e < sr.left - 4) lo = mid; else hi = mid; }
    L0 = lo;
    pens.forEach(function (g) { var c = g.querySelectorAll("circle"); if (c.length > 1) c[0].setAttribute("r", (13 / scale).toFixed(1)); c[c.length - 1].setAttribute("r", (1.5 / scale).toFixed(2)); });
    var ss = Math.min(1.3, Math.max(0.5, 1 / scale));
    sparks.forEach(function (g) { g.dataset.s = ss; });
    dirty = false; last = -2;
  }
  /* a phone's address bar coming and going resizes the window on every
     scroll; only a change of width moves the drawing */
  var lastW = innerWidth, vh0 = innerHeight;
  addEventListener("resize", function () { if (innerWidth !== lastW) { lastW = innerWidth; vh0 = innerHeight; dirty = true; } });

  var coll = document.getElementById("collection"); if (coll) coll.classList.add("cqjs");
  var cin = false;
  function reveal() { if (!cin && coll) { cin = true; coll.classList.add("cqin"); } }

  function frame(q) {
    /* the name is written across most of the section's passage, so the
       line is felt being drawn, and is finished while it is still well up
       the screen */
    var w = write(0.04, 0.8, q), len = L0 + (L - L0) * w, off = (L - len).toFixed(1);
    lines.forEach(function (e) { e.style.strokeDashoffset = off; });
    var writing = q > 0.03 && w < 1, po = writing ? (sm(0.03, 0.07, q) * (1 - sm(0.76, 0.8, q))).toFixed(3) : "0";
    if (writing) { var pt = path.getPointAtLength(len), tr = "translate(" + pt.x.toFixed(1) + " " + pt.y.toFixed(1) + ")"; pens.forEach(function (g) { g.setAttribute("transform", tr); }); }
    pens.forEach(function (g) { g.style.opacity = po; });
    /* the dot of the i, placed as the line passes the top of the letter */
    var dv = sm(0, 1, c01((len - Li) / 240)).toFixed(3);
    dots.forEach(function (d) { d.style.opacity = dv; });
    /* a few points catch the light as it finishes, and go again; scrolling
       back takes them back */
    if (sparkG) sparkG.style.opacity = "1";
    sparks.forEach(function (g, i) {
      var keep = +(g.getAttribute("data-keep") || 0), a = 0.8 + i * 0.03, k = sm(a, a + 0.03, q) * (1 - (1 - keep) * sm(a + 0.045, a + 0.09, q)), s = +(g.dataset.s || 1), xy = g.getAttribute("data-at");
      g.setAttribute("transform", "translate(" + xy + ") scale(" + (s * (0.3 + 0.7 * k)).toFixed(3) + ") rotate(" + (10 * k).toFixed(1) + ")");
      g.style.opacity = k.toFixed(3);
    });
    /* the collection's heading settles in as the name is finished: once,
       like every reveal on the page */
    if (q > 0.76) reveal();
  }

  function tick() {
    var r = sec.getBoundingClientRect(), vh = innerHeight;
    /* a fast flick can carry the name off the screen before it was finished
       here; the collection below is revealed regardless */
    if (r.bottom < vh * 0.5) reveal();
    if (r.bottom < -60 || r.top > vh + 60) return;
    if (dirty) measure();
    /* progress from the moment the section shows at the foot of the screen
       to the end of its short hold, measured against the height the window
       had when it was last resized, not the one the address bar changes */
    var hold = Math.max(1, sec.offsetHeight - stage.offsetHeight), lead = vh0;
    var p = c01((lead - r.top) / (lead + hold));
    if (p === last) return; last = p;
    frame(p);
  }
  (window.__awake || function (f) { (function l() { f(); requestAnimationFrame(l); })(); })(tick);
  window.__sig = { get p() { return last; }, get lines() { return lines.length; } };
})();
</script>
