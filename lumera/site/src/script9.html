<script>
/* The mark, drawn. The section holds while the page moves. A hand comes in
   from the side with a drafting pen and makes the first stroke; at about a
   third of it the hand lifts and leaves, and the line carries on by itself
   into the SILAVU mark, traced along the symbol's own outline. Construction
   circles and four small points at its extremes come up faintly while it
   forms and go again; then the metal fills the mark, the hairline settles
   into it, and the two lines arrive underneath. Everything is scrubbed to
   the scroll, softly, and only transform, opacity and dash offsets change.
   With reduced motion the finished mark and its words, and no hold. */
(function () {
  "use strict";
  var sec = document.getElementById("craft"); if (!sec) return;
  var stage = sec.querySelector(".sgstage"), svg = sec.querySelector(".sgsvg"), hand = sec.querySelector(".sghand"),
      guides = sec.querySelector(".sgguides"), gl = [].slice.call(sec.querySelectorAll(".sgguides > *")),
      line = sec.querySelector(".sgline"), fill = sec.querySelector(".sgfill"), pts = sec.querySelector(".sgpts"),
      head = sec.querySelector(".sghead"), c1 = sec.querySelector(".sgc1"), c2 = sec.querySelector(".sgc2"),
      segs = [].slice.call(sec.querySelectorAll(".sgline path"));
  if (!stage || !svg || !line || !segs.length) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;   /* the finished mark, as the page is written */
  sec.classList.add("sgjs");

  /* where the nib is in the photograph, as a fraction of its width and height */
  var TIPX = 0.0559, TIPY = 0.5930;
  var narrow = matchMedia("(max-width:759px)");
  var lead = null, leadLen = 1, scale = 1, p = -1, last = -2, dirty = true;
  /* the mark's six contours, drawn one after another as one line would: the
     outer loop from the point the first stroke reached, the long S through
     it, the two side loops, and the two small pieces the knot leaves */
  var lens = segs.map(function (e) { return e.getTotalLength(); }), total = lens.reduce(function (a, b) { return a + b; }, 0);
  segs.forEach(function (e, i) { e.style.strokeDasharray = lens[i] + " " + (lens[i] + 1); e.style.strokeDashoffset = lens[i]; });
  function c01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function sm(a, b, x) { x = c01((x - a) / (b - a)); return x * x * (3 - 2 * x); }
  function lin(a, b, x) { return c01((x - a) / (b - a)); }
  /* a drawing hand slows into a curve and out of it */
  function ease(a, b, x) { x = lin(a, b, x); return 0.5 - Math.cos(Math.PI * x) / 2; }

  function measure() {
    lead = sec.querySelector(narrow.matches ? ".sgm" : ".sgd");
    leadLen = lead.getTotalLength();
    lead.style.strokeDasharray = leadLen + " " + leadLen;
    /* hairlines stay hairlines at any size: the stroke is set in the drawing's
       own units from how large the drawing is on screen */
    var m = svg.getScreenCTM(); scale = m ? m.a : 1;
    var sw = (1.15 / scale).toFixed(2), gw = (0.7 / scale).toFixed(2);
    segs.forEach(function (e) { e.style.strokeWidth = sw; }); lead.style.strokeWidth = sw;
    gl.forEach(function (g) { g.style.strokeWidth = gw; });
    pts.querySelectorAll("circle").forEach(function (c) { c.setAttribute("r", (2.1 / scale).toFixed(1)); });
    head.setAttribute("r", (1.6 / scale).toFixed(1));
    dirty = false; last = -2;
  }
  addEventListener("resize", function () { dirty = true; });
  if (narrow.addEventListener) narrow.addEventListener("change", function () { dirty = true; });

  function at(path, len) { var pt = path.getPointAtLength(len), m = path.getScreenCTM(), r = stage.getBoundingClientRect();
    return { x: m.a * pt.x + m.c * pt.y + m.e - r.left, y: m.b * pt.x + m.d * pt.y + m.f - r.top }; }

  function frame(q) {
    /* 1 · the hand comes in and makes the first stroke */
    var qLead = ease(0.03, 0.3, q);
    lead.style.strokeDashoffset = (leadLen * (1 - qLead)).toFixed(1);
    lead.style.opacity = (1 - sm(0.8, 0.93, q)).toFixed(3);
    var hin = sm(0, 0.06, q), hout = sm(0.13, 0.22, q);
    if (hand && hand.complete !== false) {
      var qh = ease(0.03, 0.3, Math.min(q, 0.155)), h = at(lead, leadLen * qh), hw = hand.offsetWidth, hh = hand.offsetHeight;
      var dx = 70 * (1 - hin) + 46 * hout, dy = 40 * (1 - hin) + 64 * hout;
      hand.style.transform = "translate3d(" + (h.x - hw * TIPX + dx).toFixed(1) + "px," + (h.y - hh * TIPY + dy).toFixed(1) + "px,0)";
      hand.style.opacity = (hin * (1 - hout)).toFixed(3);
    }
    /* 2 · the line goes on alone into the mark */
    var qm = ease(0.27, 0.8, q), run = qm * total, at0 = 0, cur = null, curLen = 0;
    for (var i = 0; i < segs.length; i++) {
      var d = c01((run - at0) / lens[i]);
      segs[i].style.strokeDashoffset = (lens[i] * (1 - d)).toFixed(1);
      if (d > 0 && d < 1) { cur = segs[i]; curLen = lens[i] * d; }
      at0 += lens[i];
    }
    line.style.opacity = (1 - 0.6 * sm(0.84, 0.95, q)).toFixed(3);
    /* the point of light at the end of the line, while it is being drawn */
    var drawing = q > 0.03 && q < 0.8, hp;
    if (drawing) {
      hp = q < 0.29 || !cur ? lead.getPointAtLength(leadLen * qLead) : cur.getPointAtLength(curLen);
      head.setAttribute("cx", hp.x.toFixed(1)); head.setAttribute("cy", hp.y.toFixed(1));
    }
    head.style.opacity = drawing ? (0.9 * sm(0.03, 0.06, q) * (1 - sm(0.74, 0.8, q))).toFixed(3) : "0";
    /* 3 · the construction, faintly, and the four points */
    var g = ease(0.1, 0.46, q);
    gl.forEach(function (e, i) { e.style.strokeDashoffset = (1 - c01(g * 1.25 - i * 0.06)).toFixed(4); });
    guides.style.opacity = (0.2 * sm(0.08, 0.16, q) * (1 - sm(0.78, 0.9, q))).toFixed(3);
    pts.style.opacity = (0.85 * sm(0.38, 0.52, q) * (1 - sm(0.82, 0.93, q))).toFixed(3);
    /* 4 · the metal, then the words */
    fill.style.opacity = sm(0.8, 0.93, q).toFixed(3);
    var a1 = sm(0.88, 0.96, q), a2 = sm(0.91, 0.99, q);
    c1.style.opacity = a1.toFixed(3); c1.style.transform = "translate3d(0," + (10 * (1 - a1)).toFixed(1) + "px,0)";
    c2.style.opacity = a2.toFixed(3); c2.style.transform = "translate3d(0," + (10 * (1 - a2)).toFixed(1) + "px,0)";
  }

  function tick() {
    requestAnimationFrame(tick);
    var r = sec.getBoundingClientRect(), vh = innerHeight;
    if (r.bottom < -60 || r.top > vh + 60) return;
    if (dirty) measure();
    var t = c01(-r.top / Math.max(1, r.height - vh));
    if (p < 0) p = t; else { p += (t - p) * 0.11; if (Math.abs(t - p) < 0.0003) p = t; }
    if (p === last) return; last = p;
    frame(p);
  }
  requestAnimationFrame(tick);
  window.__sig = { get p() { return p; } };
})();
</script>
