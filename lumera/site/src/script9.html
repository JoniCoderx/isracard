<script>
/* The signature. The section holds while the page moves, and one line comes
   in from the left edge of the screen and writes SILAVU without lifting: the
   rising stroke and top loop of the S, the swash under it into the i, the
   loop of the l, the a, the v, the u, and a long stroke rising away to a
   point of light. Through the letters it is polished metal; a small light
   travels with its end, and the dot of the i is placed as it passes. As it
   finishes, a few points catch the light, briefly (the one at the end keeps
   a little), and the two lines arrive under the name. Scrubbed to the
   scroll, softly; only dash offsets, transforms and opacity change. With
   reduced motion, the written name and its words, and no hold. */
(function () {
  "use strict";
  var sec = document.getElementById("craft"); if (!sec) return;
  var stage = sec.querySelector(".sgstage"), svg = sec.querySelector(".sgsvg"), path = sec.querySelector(".sgpath"),
      body = sec.querySelector(".sgbody"), halo = sec.querySelector(".sghalo"), pen = sec.querySelector(".sgpen"),
      dot = sec.querySelector(".sgdot"), sparks = [].slice.call(sec.querySelectorAll(".sgspark > g")),
      sparkG = sec.querySelector(".sgspark"), c1 = sec.querySelector(".sgc1"), c2 = sec.querySelector(".sgc2");
  if (!stage || !svg || !path) return;
  var layers = [path, body, halo];
  /* the top of the i, where its dot is placed */
  var ANCH = [[457, 234]];
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  sec.classList.add("sgjs");

  var L = path.getTotalLength(), L0 = 0, L1 = L, Ls = [], scale = 1, p = -1, last = -2, dirty = true;
  function c01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function sm(a, b, x) { x = c01((x - a) / (b - a)); return x * x * (3 - 2 * x); }
  /* a hand writes at an even pace, easing only as it starts and as it ends */
  function write(a, b, x) { x = c01((x - a) / (b - a)); var e = 0.1;
    return x < e ? x * x / (2 * e) / (1 - e) : x > 1 - e ? 1 - (1 - x) * (1 - x) / (2 * e) / (1 - e) : (x - e / 2) / (1 - e); }
  layers.forEach(function (e) { e.style.strokeDasharray = L + " " + (L + 2); });
  /* the length along the line nearest the top of the i, found once */
  (function () { var N = 1600, best = ANCH.map(function () { return [1e9, 0]; });
    for (var i = 0; i <= N; i++) { var l = L * i / N, q = path.getPointAtLength(l);
      ANCH.forEach(function (a, k) { var d = (q.x - a[0]) * (q.x - a[0]) + (q.y - a[1]) * (q.y - a[1]); if (d < best[k][0]) best[k] = [d, l]; }); }
    Ls = best.map(function (b) { return b[1]; }); })();

  function measure() {
    var m = svg.getScreenCTM(); scale = m ? m.a : 1;
    /* fine at any size: the hairline about 1.1px on screen, the metal 2.4px */
    path.style.strokeWidth = (1.1 / scale).toFixed(2);
    body.style.strokeWidth = (2.4 / scale).toFixed(2);
    halo.style.strokeWidth = (7 / scale).toFixed(2);
    dot.setAttribute("r", (2.5 / scale).toFixed(2));
    /* the line is drawn from where it enters the screen */
    var sr = stage.getBoundingClientRect(), lo = 0, hi = L * 0.5, k, mid, pt;
    for (k = 0; k < 20; k++) { mid = (lo + hi) / 2; pt = path.getPointAtLength(mid); if (m.a * pt.x + m.c * pt.y + m.e < sr.left - 4) lo = mid; else hi = mid; }
    L0 = lo; L1 = L;
    pen.firstElementChild.setAttribute("r", (13 / scale).toFixed(1));
    pen.lastElementChild.setAttribute("r", (1.5 / scale).toFixed(2));
    var ss = Math.min(1.3, Math.max(0.5, 1 / scale));
    sparks.forEach(function (g) { g.dataset.s = ss; });
    dirty = false; last = -2;
  }
  /* a phone's address bar coming and going resizes the window on every
     scroll; only a change of width moves the drawing */
  var lastW = innerWidth, vh0 = innerHeight;
  addEventListener("resize", function () { if (innerWidth !== lastW) { lastW = innerWidth; vh0 = innerHeight; dirty = true; } });

  /* The black pours in. The chapter arrives white beneath the dark box, and
     as it rises the black runs down into it from the top, the left side
     first, its edge rippling like silk as it falls, until it settles into
     the wave; a thread of light runs along the falling edge. Driven by the
     scroll, not by time: it stops when the page stops. */
  var fill = sec.querySelector(".sgfill"), edge = sec.querySelector(".sgedge");
  var WAVE = [[0,30],[50,120],[110,270],[210,325],[250,345],[290,332],[330,334],[390,338],[425,380],[458,500],[478,575],[495,628],[540,628],[640,622],[690,622],[728,652],[765,735],[815,845],[900,955],[1000,1000]];
  var lastF = -1;
  function pour(f) {
    if (!fill || f === lastF) return; lastF = f;
    var P = WAVE.map(function (pt) {
      var x = pt[0], k = sm(0, 1, f * 1.4 - x / 1000 * 0.4), live = k * (1 - k) * 4;
      return [x, (pt[1] * k + 26 * Math.sin(x / 1000 * Math.PI * 3.2 + f * 5.5) * live).toFixed(1)];
    });
    var s = function (i) { return P[i][0] + " " + P[i][1]; };
    var curve = "M" + s(0) + " C " + s(1) + ", " + s(2) + ", " + s(3) + " C " + s(4) + ", " + s(5) + ", " + s(6) + " C " + s(7) + ", " + s(8) + ", " + s(9)
      + " C " + s(10) + ", " + s(11) + ", " + s(12) + " L " + s(13) + " C " + s(14) + ", " + s(15) + ", " + s(16) + " C " + s(17) + ", " + s(18) + ", " + s(19);
    fill.setAttribute("d", curve + " L 1000 1300 L 0 1300 Z");
    if (edge) { edge.setAttribute("d", curve); edge.style.opacity = (f > 0.001 && f < 0.999 ? Math.min(1, 6 * Math.min(f, 1 - f)) : 0).toFixed(3); }
  }
  function frame(q) {
    pour(sm(0, 0.5, q));
    var w = write(0.03, 0.8, q), len = L0 + (L1 - L0) * w, off = (L - len).toFixed(1);
    layers.forEach(function (e) { e.style.strokeDashoffset = off; });
    var writing = q > 0.015 && w < 1;
    if (writing) { var pt = path.getPointAtLength(len); pen.setAttribute("transform", "translate(" + pt.x.toFixed(1) + " " + pt.y.toFixed(1) + ")"); }
    pen.style.opacity = writing ? (sm(0.015, 0.05, q) * (1 - sm(0.76, 0.8, q))).toFixed(3) : "0";
    /* the dot of the i, placed as the line passes the top of the letter */
    dot.style.opacity = sm(0, 1, c01((len - Ls[0]) / 240)).toFixed(3);
    /* a few points catch the light, one after another, and go again */
    sparkG.style.opacity = "1";
    sparks.forEach(function (g, i) {
      var keep = +(g.getAttribute("data-keep") || 0), a = 0.79 + i * 0.03, k = sm(a, a + 0.03, q) * (1 - (1 - keep) * sm(a + 0.045, a + 0.09, q)), s = +(g.dataset.s || 1), xy = g.getAttribute("data-at");
      g.setAttribute("transform", "translate(" + xy + ") scale(" + (s * (0.3 + 0.7 * k)).toFixed(3) + ") rotate(" + (10 * k).toFixed(1) + ")");
      g.style.opacity = k.toFixed(3);
    });
    /* the white field holds still where it was drawn: moving it bared the
       black against the foot of the stage in a straight edge. What moves
       across it is the line being written, white on the black and ink on
       the white. */
    var a1 = sm(0.82, 0.92, q), a2 = sm(0.86, 0.96, q);
    c1.style.opacity = a1.toFixed(3); c1.style.transform = "translate3d(0," + (10 * (1 - a1)).toFixed(1) + "px,0)";
    c2.style.opacity = a2.toFixed(3); c2.style.transform = "translate3d(0," + (10 * (1 - a2)).toFixed(1) + "px,0)";
  }

  function tick() {
    var r = sec.getBoundingClientRect(), vh = innerHeight;
    if (r.bottom < -60 || r.top > vh + 60) return;
    if (dirty) measure();
    /* progress through the hold, against the stage's own height (a fixed
       100svh) rather than the window's, which changes as the address bar does */
    /* it starts writing as soon as the stone above has gone, while the
       section is still rising into view, so there is no blank black screen:
       from the moment the line itself comes up over the bottom of the screen,
       to the end of the hold */
    /* the writing begins the moment the chapter shows at the foot of the
       screen, so nobody waits in front of an empty black field */
    var hold = Math.max(1, sec.offsetHeight - stage.offsetHeight), lead = vh0;
    var t = c01((lead - r.top) / (lead + hold));
    /* the line follows the scroll with a little weight: eased per frame, the
       same at 60 and 120 frames a second */
    var now = performance.now(), dt = Math.min(64, now - (tick.t || now)); tick.t = now;
    var k = 1 - Math.pow(0.88, dt / 16.7);
    if (p < 0) p = t; else { p += (t - p) * k; if (Math.abs(t - p) < 0.0002) p = t; }
    if (p === last) return p !== t; last = p;
    frame(p);
    return p !== t;
  }
  (window.__awake || function (f) { (function l() { f(); requestAnimationFrame(l); })(); })(tick);
  window.__sig = { get p() { return p; } };
})();
</script>
