<script>
/* Scroll-driven chapters: the box film, scrubbed frame by frame as you scroll, and the collection rail that moves sideways with the page. */
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); }, c01 = function (v) { return Math.max(0, Math.min(1, v)); };
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches, mobile = matchMedia("(max-width:999px)").matches, phone = matchMedia("(max-width:899px)").matches;
  var rtl = function () { return document.documentElement.dir === "rtl"; };

  /* ── a scrubbed film: a tall pin, a sticky screen, and a strip of frames drawn
       to a canvas as the page moves. The box chapter has used this since the
       beginning; the Dubai film uses the same machine, with its own frames. ── */
  function sequence(o) {
    var pin = $(o.pin), cv = $(o.canvas), ctx = cv && cv.getContext("2d");
    if (!pin || !ctx) return null;
    var SET = o.set(), N = typeof o.n === "function" ? o.n(SET) : o.n, frames = new Array(N), asked = new Array(N), loaded = 0, requested = 0, cur = -1;
    var W = 0, H = 0, DPR = 1, drawn = -1, started = false, lastP = -1, lastZoom = -1, lastT = 0;
    function src(i) { return o.dir + SET + "-" + (i < 10 ? "0" : "") + i + (o.ext || ".jpg"); }
    function load(i, cb) { if (frames[i] || requested > N + 2) return; var im = new Image(); im.decoding = "async"; requested++; im.onload = function () { frames[i] = im; loaded++; if (cb) cb(); }; im.src = src(i); }
    /* Fetch from where the eye is, not from the top. A fixed order fills the far
       end of the strip while the frames either side of the playhead are still
       missing, and that is what a scrub feels as a hold and then a catch-up.
       Asking for the nearest missing frame first closes the gap you are looking
       through before any other. */
    function loadAll() {
      if (started) return; started = true;
      asked[0] = 1; load(0, function () { draw(true); });
      (function next() {
        var batch = 0;
        while (batch < 6) {
          var want = Math.max(0, Math.min(N - 1, Math.round(Math.max(0, cur) * (N - 1)))), pick = -1;
          for (var d = 0; d < N; d++) {
            if (want - d >= 0 && !asked[want - d]) { pick = want - d; break; }
            if (want + d < N && !asked[want + d]) { pick = want + d; break; }
          }
          if (pick < 0) return;
          asked[pick] = 1; load(pick); batch++;
        }
        setTimeout(next, 60);
      })();
    }
    /* There is no point owning more canvas than the strip can fill. A frame is
       o.src wide; asking a full-screen buffer for three times that is fill rate
       spent on pixels the footage never had, and fill rate is the whole budget
       of a scrub. Cap the buffer at a little over the source and let the
       compositor do the last bit of scaling for free. */
    function size() {
      var r = cv.getBoundingClientRect();
      DPR = Math.min(devicePixelRatio || 1, 2);
      var sw = typeof o.src === "function" ? o.src(SET) : o.src;
      if (sw) DPR = Math.min(DPR, Math.max(1, sw / Math.max(1, r.width)));
      W = Math.round(r.width * DPR); H = Math.round(r.height * DPR);
      if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; drawn = -1; }
    }
    /* While the strip is still filling, the frame we want may not be here yet.
       Reaching far up or down the strip for a substitute is what makes a scrub
       jump. Once something is on screen we would rather hold it than cut to a
       frame that is nowhere near: a hold reads as a held shot, a jump reads as
       broken. Before the first draw, anything is better than nothing. */
    function nearest(i, max) { for (var d = 0; d <= (max || N); d++) { if (frames[i - d]) return i - d; if (frames[i + d]) return i + d; } return -1; }
    function draw(force) {
      var want = Math.max(0, Math.min(N - 1, Math.round(cur * (N - 1))));
      var have = nearest(want, drawn < 0 ? N : 2); if (have < 0) return;
      /* the cinematic push: a very small scale and drift on top of the camera's own move */
      var z = o.zoom ? o.zoom(cur) : null;
      var zk = z ? z.s : 1, zy = z ? z.y : 0;
      if (!force && have === drawn && Math.abs(zk - lastZoom) < 0.0004) return;
      drawn = have; lastZoom = zk;
      var im = frames[have], iw = im.naturalWidth, ih = im.naturalHeight;
      var sc = Math.max(W / iw, H / ih) * zk, dw = iw * sc, dh = ih * sc;
      var ox = (W - dw) / 2, oy = (H - dh) / 2 + zy * DPR;
      ctx.clearRect(0, 0, W, H); ctx.drawImage(im, ox, oy, dw, dh);
    }
    function tick() {
      var r = pin.getBoundingClientRect();
      /* A strip of full-screen frames is a great deal of decoded bitmap to keep
         resident, and a phone has to hold the box chapter as well. When this one
         is well out of the way, let it go; the frames come back from the HTTP
         cache the moment it is approached again. */
      if (o.release && started && r.bottom < -innerHeight * 2.5) { frames = new Array(N); asked = new Array(N); loaded = 0; requested = 0; started = false; drawn = -1; lastP = -1; lastZoom = -1; lastT = 0; }
      if (r.bottom < -innerHeight || r.top > innerHeight * 2.5) return;
      if (!started) { size(); loadAll(); }
      var target = c01(-r.top / (r.height - innerHeight)); if (reduce) target = Math.max(target, o.still || 0.5);
      /* The catch-up is per unit of time, not per animation frame. Written the
         obvious way — p += (target - p) * 0.2 every frame — the scrub tracks the
         finger at sixty frames a second and drags visibly behind it on anything
         slower, which is where it matters most. Same 0.2 at 60fps, same feel at
         20. */
      var now = performance.now(), dt = lastT ? Math.min(100, now - lastT) : 16.7; lastT = now;
      var k = 1 - Math.pow(0.8, dt / 16.667);
      var p = reduce ? target : (lastP < 0 ? target : lastP + (target - lastP) * k); if (Math.abs(target - p) < 0.0008) p = target;
      if (p !== lastP) { lastP = p; cur = p; draw(p < 0.16); if (o.at) o.at(p); }
      else if (loaded < N) draw(false);
    }
    addEventListener("resize", function () { size(); draw(true); });
    return { tick: tick, size: size, redraw: function () { draw(true); },
      get p() { return lastP; }, get loaded() { return loaded; }, get requested() { return requested; }, get frame() { return drawn; }, get ok() { return started; } };
  }

  /* ── the box ── */
  var beats = Array.prototype.slice.call(document.querySelectorAll("#beats .beat")), pprog = $("pprog"), pcue = document.querySelector(".pcue"), dots = Array.prototype.slice.call(document.querySelectorAll("#pdots i"));
  function beatsAt(p) {
    var n = beats.length;
    for (var i = 0; i < n; i++) { var c = (i + 0.5) / n, d = Math.abs(p - c) / (0.68 / n), s2 = c01((d - 0.5) / 0.5), op = 1 - s2 * s2 * (3 - 2 * s2); beats[i].style.opacity = op.toFixed(3); beats[i].style.transform = (mobile ? "" : "translateY(-50%) ") + "translateY(" + ((p - c) * -60).toFixed(1) + "px)"; beats[i].style.pointerEvents = op > 0.5 ? "auto" : "none"; }
    pprog.style.width = (p * 100).toFixed(2) + "%"; if (pcue) pcue.style.opacity = p > 0.9 ? "0" : "1";
    var k = Math.min(n - 1, Math.floor(p * n)); for (var j = 0; j < dots.length; j++) dots[j].classList.toggle("on", j === k);
  }
  var box = sequence({
    pin: "stonepin", canvas: "boxcv", n: 96, dir: "/f/box/",
    set: function () { return phone ? "m" : (innerWidth * Math.min(devicePixelRatio || 1, 2) >= 2400 ? "x" : "d"); },
    at: beatsAt
  });

  /* ── the Dubai film ── */
  var fveil = document.querySelector("#film .fveil"), ftxt = $("ftxt"), fscreen = document.querySelector("#film .fscreen");
  var film = sequence({
    pin: "filmpin", canvas: "filmcv", dir: "/f/film/", ext: ".webp",
    /* the same tier rule the box chapter uses */
    set: function () { return phone ? "m" : (innerWidth * Math.min(devicePixelRatio || 1, 2) >= 2400 ? "x" : "d"); },
    /* what each strip actually holds, so the canvas never asks for more pixels
       than exist in the frame — and, now that the frames are 4K restorations,
       never settles for fewer either */
    src: function (set) { return set === "m" ? 888 : set === "x" ? 2200 : 1600; },
    /* the phone strip is two thirds of the frames: a ten-second push-in carries
       perfectly well at fifty, and it is a third of what a phone would fetch */
    n: function (set) { return set === "m" ? 50 : 75; },
    still: 0.62,
    /* it opens out of black and closes back into it, and drifts a little the whole way */
    zoom: function (p) { return { s: 1.055 - 0.055 * p, y: (0.5 - p) * 26 }; },
    release: true,
    at: function (p) {
      if (reduce) return;   /* the stylesheet holds it open and still */
      /* It used to come up out of a full black frame, which is a title card, not
         a cut. It arrives already lit and only the first breath is veiled, so it
         enters from the chapter above it rather than from nowhere. It still
         leaves by dissolving from the bottom up. */
      if (fveil) fveil.style.opacity = (0.55 * (1 - c01(p / 0.09))).toFixed(3);
      if (fscreen) {
        var g = c01((p - 0.86) / 0.14); g = g * g * (3 - 2 * g);     /* short, and only at the very end */
        fscreen.style.setProperty("--fmp", (-5 - g * 295).toFixed(1) + "%");
      }
      if (ftxt) { var t = c01(p / 0.10) * (1 - c01((p - 0.30) / 0.16)); ftxt.style.opacity = t.toFixed(3); ftxt.style.transform = "translateY(" + ((1 - t) * 22).toFixed(1) + "px)"; }
    }
  });

  /* ── the rail ── */
  var hpin = $("hpin"), track = $("htrack"), range = 0, lastX = -1, lastP2 = -1, rprog = $("rprog"), rcue = document.querySelector(".rcue");
  function railSize() { if (!hpin || mobile) { if (hpin) { hpin.style.height = ""; } return; } range = Math.max(0, track.scrollWidth - innerWidth); hpin.style.height = (innerHeight + range) + "px"; var hs = hpin.querySelector(".hstick"); if (hs) hs.classList.toggle("fits", range === 0); }
  function railTick() {
    if (!hpin || mobile) return; var r = hpin.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return;
    var pt = c01(-r.top / Math.max(1, range)), p = reduce || lastP2 < 0 ? pt : lastP2 + (pt - lastP2) * 0.2; if (Math.abs(pt - p) < 0.0005) p = pt; lastP2 = p; var x = p * range * (rtl() ? 1 : -1);
    if (x !== lastX) { lastX = x; track.style.transform = "translate3d(" + x.toFixed(1) + "px,0,0)"; if (rprog) rprog.style.width = (p * 100).toFixed(2) + "%"; if (rcue) rcue.style.opacity = p > 0.85 ? "0" : "1"; }
  }
  railSize(); addEventListener("resize", function () { mobile = matchMedia("(max-width:999px)").matches; railSize(); });
  setTimeout(railSize, 800); addEventListener("load", railSize);

  function tick() { requestAnimationFrame(tick); if (document.hidden) return; if (box) box.tick(); if (film) film.tick(); railTick(); }
  tick();
  window.__box = box || { p: -1, loaded: 0, requested: 0, frame: -1, ok: false };
  window.__stone = window.__box;
  window.__film = film || { p: -1, loaded: 0, requested: 0, frame: -1, ok: false };
})();
</script>
