    return { tick: tick, size: size, redraw: function () { draw(true); },
      get p() { return lastP; }, get loaded() { return loaded; }, get requested() { return requested; }, get frame() { return drawn; }, get ok() { return started; },
      get held() { return held; }, get peak() { return peak; }, get step() { return STEP; }, get win() { return WIN; }, get width() { var f = frames[drawn]; return f ? f.naturalWidth : 0; } };
  }

  /* ── the box ── */

  var outEls = [$("boxcv"), $("beats"), pprog && pprog.parentElement, $("pdots")], pinEl = $("stonepin");
  /* The chapter does not hold on its last frame, and it never leaves a black

  function beatsAt(p) {
    var n = beats.length;
    /* One stage at a time. The fades used to follow the scroll and cross, so
       a reader who stopped between two stages got both headlines and both

    pin: "stonepin", canvas: "boxcv", n: 96, dir: "/f/box/", ext: ".webp",
    /* Ninety-six full-screen frames is the largest thing on the page, and it

       moment a reader passed it until they closed the tab. Everything after it
       — the catalogue, the builder, the film, the form — was asking a phone for
       memory the second chapter was still holding. It comes back out of the
       HTTP cache the moment the chapter is approached again, so the scroll

    /* how much of the strip is held at once, and how much of it is used on a

    /* Four tiers now. The frames are cut from a 4K restoration rather than

</script>
