<script>
/* The finishing layer: words that rise out of a mask, photographs that unveil, stars that live on the stones, sparks under the cursor, buttons that lean toward the hand. */
(function () {
  "use strict";
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches, fine = matchMedia("(hover:hover) and (pointer:fine)").matches;
  var $ = function (id) { return document.getElementById(id); };

  /* ── split headings into words; each word rises out of its own mask ── */
  function splitNode(node, state) {
    var kids = Array.prototype.slice.call(node.childNodes);
    kids.forEach(function (n) {
      if (n.nodeType === 3) {
        var parts = n.textContent.split(/(\s+)/), frag = document.createDocumentFragment();
        parts.forEach(function (p) {
          if (!p) return;
          if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(" ")); return; }
          var w = document.createElement("span"); w.className = "w"; var s = document.createElement("span"); s.textContent = p; s.style.transitionDelay = (state.i++ * 0.055).toFixed(3) + "s"; w.appendChild(s); frag.appendChild(w);
        });
        node.replaceChild(frag, n);
      } else if (n.nodeType === 1) { if (n.tagName === "EM") n.classList.add("sd"); splitNode(n, state); }
    });
  }
  function split() {
    document.querySelectorAll(".sp").forEach(function (el) { if (el.querySelector(".w")) return; splitNode(el, { i: 0 }); });
  }
  split();

  /* ── a photograph inside a sideways tray never meets the viewport, so we load it when its chapter does ── */
  (function () {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return;
        e.target.querySelectorAll("img[loading=lazy]").forEach(function (im) { im.loading = "eager"; if (!im.complete) { var s = im.currentSrc || im.src; im.src = s; } });
        io.unobserve(e.target);
      });
    }, { rootMargin: "300% 0px" });
    document.querySelectorAll("#collection, #macro, #clients, #what, #bespoke, .tray").forEach(function (el) { io.observe(el); });
  })();

  /* The photographs no longer tilt, catch a moving light or lean away from the
     cursor. A picture that moves when you point at it is an effect; a picture
     that holds still is a photograph. */

  /* ── the wrist chapter: the photograph opens out of a small frame as you scroll ── */
  var wpin = $("wpin"), wframe = $("wframe"), wimg = $("wimg"), wtxt = $("wtxt"), wveil = wframe && wframe.querySelector(".veil"), lastW = -1, mob = matchMedia("(max-width:999px)").matches;
  function wristTick() {
    if (!wpin || reduce) return; var r = wpin.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return;
    var pt = Math.max(0, Math.min(1, -r.top / (r.height - innerHeight))), p = lastW < 0 ? pt : lastW + (pt - lastW) * 0.2; if (Math.abs(pt - p) < 0.0008) p = pt; if (p === lastW) return; lastW = p;
    var e = p < 0.6 ? (function (t) { return 1 - Math.pow(1 - t, 3); })(p / 0.6) : 1;
    var ix = (mob ? 12 : 22) * (1 - e), iy = (mob ? 34 : 30) * (1 - e), rd = 14 * (1 - e);
    wframe.style.clipPath = "inset(" + iy.toFixed(2) + "% " + ix.toFixed(2) + "% " + iy.toFixed(2) + "% " + ix.toFixed(2) + "% round " + rd.toFixed(1) + "px)";
    /* The window opens from a small inset to full bleed — and the photograph
       inside it was going the other way, 1.18 down to 1.06, so the wrist and
       the watch started large and shrank while the frame grew. Two halves of
       one move pulling against each other, which is what read as backwards.
       It opens small and grows now: the frame widens and the piece comes
       toward you, one movement. */
    wimg.style.transform = "scale(" + (1.04 + 0.12 * e + p * 0.03).toFixed(4) + ") translateY(" + ((p - 0.5) * -3).toFixed(2) + "%)";
    var t = Math.max(0, Math.min(1, (p - 0.55) / 0.3)); wtxt.style.opacity = t.toFixed(3); wtxt.style.transform = "translateY(" + ((1 - t) * 30).toFixed(1) + "px)"; wveil.style.opacity = Math.max(0, Math.min(1, (p - 0.4) / 0.3)).toFixed(3);
  }
  window.__awake(function () { var was = lastW; wristTick(); return lastW !== was; });

  /* Buttons no longer lean toward the hand either — it was the fourth thing on
     the page reacting to the cursor, and the least worth keeping. */

  /* ── the header settles once you leave the film; the hero caption drifts up and away ── */
  var header = $("header"), hcap = $("hcap"), hfacts = document.querySelector(".hfacts"), lastY = -1, heroMedia = Array.prototype.slice.call(document.querySelectorAll("#hero .hv"));
  function onScroll() {
    var y = scrollY; if (y === lastY) return; lastY = y;
    header.classList.toggle("scrolled", y > 40);
    if (!reduce && y < innerHeight) { var f = Math.min(1, y / (innerHeight * 0.7)); hcap.style.opacity = (1 - f * f).toFixed(3); if (hfacts) hfacts.style.opacity = (1 - f * 1.4).toFixed(3);
      /* on a phone the words stay where they are and only fade: following the
         finger with the caption and growing the photograph cost a frame on
         every touch move, and the text sliding under the thumb read badly */
      if (!still) { hcap.style.transform = "translateY(" + (y * 0.28).toFixed(1) + "px)"; var sc = "scale(" + (1 + f * 0.12).toFixed(3) + ")"; heroMedia.forEach(function (m) { m.style.transform = sc; }); } }
  }
  var still = matchMedia("(max-width:899px), (pointer:coarse)").matches, tick = 0;
  addEventListener("scroll", function () { if (!tick) tick = requestAnimationFrame(function () { tick = 0; onScroll(); }); }, { passive: true }); onScroll();

  /* ── second try-on button, inside the configurator ── */
  var t2 = $("tryonBtn2"); if (t2) t2.addEventListener("click", function () { if (window.__tryon) window.__tryon.open(); });

  /* ── a photograph that fails to arrive is asked for again, quietly ── */
  document.addEventListener("error", function (e) { var im = e.target; if (!im || im.tagName !== "IMG" || !im.currentSrc) return; var n = +(im.getAttribute("data-retry") || 0); if (n >= 2) return; im.setAttribute("data-retry", n + 1); var src = im.currentSrc; setTimeout(function () { var u = src.split("?")[0] + "?r=" + (n + 1); if (im.srcset) { im.srcset = im.srcset.split(",").map(function (c) { var t = c.trim().split(/\s+/); return t[0].split("?")[0] + "?r=" + (n + 1) + (t[1] ? " " + t[1] : ""); }).join(", "); } im.src = u; }, 1500 * (n + 1)); }, true);
  /* The symbol in the bar used to bloom and blur with scroll velocity. A
     drop-shadow is not how metal behaves, and it was a glow by another name. */

  /* ── the house mark comes apart as it leaves: it floats up, separates into its
       colours and drifts away, then gathers again on the way back ── */
  (function () {
    var marks = [].slice.call(document.querySelectorAll(".hsig, .fbig"));
    if (!marks.length || reduce) return;
    var pending = false;
    function tick() {
      pending = false;
      for (var i = 0; i < marks.length; i++) {
        var m = marks[i], r = m.getBoundingClientRect();
        if (r.bottom < -200 || r.top > innerHeight + 200) continue;
        var mid = r.top + r.height / 2, half = innerHeight / 2;
        var sp = (mid - half) / half;                 /* -1 above, 0 centred, +1 below */
        sp = Math.max(-1, Math.min(1, sp));
        var e = sp < 0 ? -1 : 1, a = Math.abs(sp);
        a = a * a;                                    /* hold it steady near the centre */
        m.style.setProperty("--sp", (e * a).toFixed(3));
        m.style.setProperty("--spa", a.toFixed(3));
        /* the light travels across the metal as the mark crosses the screen */
        m.style.setProperty("--sw", (0.5 - sp * 0.5).toFixed(3));
      }
    }
    addEventListener("scroll", function () { if (!pending) { pending = true; requestAnimationFrame(tick); } }, { passive: true });
    addEventListener("resize", function () { if (!pending) { pending = true; requestAnimationFrame(tick); } }, { passive: true });
    tick();
  })();
  /* Headings used to lean toward the pointer and part their words around
     it. Scrolling with the hand resting on a heading made the words shift
     under it, which read as the page twitching, so headings stay still. */
  /* ── the card's own gallery ──────────────────────────────────────────
     Each card rests on its first photograph, the piece clean on white, so the
     set reads as one. Its other photographs are there without opening it:
     a finger swipes through them, a mouse gets two arrows and a slow walk
     while it rests on the card, and the dots say where you are. A swipe only
     changes the photograph — it never opens the piece, and a vertical drag
     is left to the page. A tap or a click opens the piece at the photograph
     on show. The extra frames are fetched on first use, not with the page. */
  (function () {
    var fine = matchMedia("(hover:hover) and (pointer:fine)").matches;
    var still = matchMedia("(prefers-reduced-motion: reduce)").matches;
    function rtl() { return document.documentElement.dir === "rtl"; }
    [].slice.call(document.querySelectorAll(".pgrid .piece[data-shots]")).forEach(function (pc) {
      var fig = pc.querySelector(".fig.swp"); if (!fig) return;
      var shots; try { shots = JSON.parse(pc.getAttribute("data-shots")); } catch (e) { return; }
      if (!shots || shots.length < 2) { fig.classList.add("one"); return; }
      var base = fig.querySelector(".im img"), sizes = base ? base.getAttribute("sizes") : "100vw";
      var dots = [].slice.call(fig.querySelectorAll(".swd i")), layers = null, at = 0, t = 0, manual = false, wasT = 0;
      function build() {
        if (layers) return; layers = [null];
        for (var i = 1; i < shots.length; i++) {
          var sh = shots[i], w = sh.w && sh.w.length ? sh.w : [800, 1200, 1600, 2000];
          var d = document.createElement("div"); d.className = "im hx";
          var im = document.createElement("img"); im.alt = ""; im.decoding = "async"; im.setAttribute("sizes", sizes);
          im.setAttribute("srcset", w.map(function (x) { return "img/" + sh.i + "-" + x + ".jpg " + x + "w"; }).join(", "));
          im.src = "img/" + sh.i + "-" + w[Math.min(1, w.length - 1)] + ".jpg";
          d.appendChild(im); fig.insertBefore(d, fig.querySelector(".sheen")); layers.push(d);
        }
      }
      function ready(i) { var im = layers[i] && layers[i].firstChild; return !im || (im.complete && im.naturalWidth > 0); }
      /* the photographs slide, like turning through a set of prints: the next
         comes in from the side it was asked for and the last goes out the
         other way. Only the frame's own transform moves, inside the card. */
      var baseIm = fig.querySelector(".im:not(.hx):not(.dt)");
      function frames() { return layers.map(function (l, k) { return k === 0 ? baseIm : l; }); }
      function place(el, x, anim) { if (!el) return; el.style.transition = anim ? "transform .62s cubic-bezier(.22,.72,.2,1)" : "none"; el.style.transform = "translate3d(" + x + "%,0,0)"; }   /* always explicit: an empty value would hand a waiting frame back to the stylesheet, which parks it outside the card */
      function show(i, dir) {
        if (!layers) build();
        var all = frames(), prev = at; if (i === prev) return; at = i; pc.__at = i;
        dir = dir || (i > prev ? 1 : -1); if (rtl()) dir = -dir;
        all.forEach(function (l, k) { if (l && k !== i && k !== prev) place(l, 100, false); });
        if (still) { place(all[prev], 100, false); place(all[i], 0, false); }
        else { place(all[i], dir * 100, false); void all[i].offsetWidth; place(all[i], 0, true); place(all[prev], -dir * 100, true); }
        layers.forEach(function (l, k) { if (l) l.classList.toggle("on", k === i); });
        dots.forEach(function (d, k) { d.classList.toggle("on", k === i); });
      }
      function go(n, dir) {
        build(); n = (n + shots.length) % shots.length;
        if (ready(n)) show(n, dir); else layers[n].firstChild.addEventListener("load", function () { show(n, dir); }, { once: true });
      }
      pc.__at = 0; pc.__show = function (i) { manual = true; go(i); };
      /* two arrows, for a mouse */
      fig.querySelectorAll(".cnav").forEach(function (b) {
        b.addEventListener("click", function (e) { e.stopPropagation(); e.preventDefault(); manual = true; clearInterval(t); var d = b.classList.contains("cnext") ? 1 : -1; go(at + d, d); });
      });
      /* a slow walk while a mouse rests on the card, until the arrows are used */
      if (fine) {
        pc.addEventListener("pointerenter", function (e) {
          if (e.pointerType !== "mouse") return; build(); clearInterval(t);
          if (!still && !manual) t = setInterval(function () { go(at + 1 >= shots.length ? 1 : at + 1, 1); }, 1700);
        });
        pc.addEventListener("pointerleave", function (e) {
          if (e.pointerType !== "mouse") return; clearInterval(t);
          if (!document.querySelector(".modal.open")) { manual = false; if (at !== 0) show(0, -1); }
        });
      }
      /* a swipe, for a finger: sideways changes the photograph, upright is the page's */
      var sx = 0, sy = 0, down = false, swiped = false;
      fig.addEventListener("pointerdown", function (e) { if (e.pointerType === "mouse") return; sx = e.clientX; sy = e.clientY; down = true; swiped = false; build(); });
      fig.addEventListener("pointermove", function (e) {
        if (!down) return; var dx = e.clientX - sx, dy = e.clientY - sy;
        if (Math.abs(dy) > 14 && Math.abs(dy) > Math.abs(dx)) { down = false; return; }
        if (Math.abs(dx) > 34 && Math.abs(dx) > Math.abs(dy) * 1.2) { down = false; swiped = true; manual = true; var d = (dx < 0) !== rtl() ? 1 : -1; go(at + d, d); }
      });
      fig.addEventListener("pointerup", function () { down = false; });
      fig.addEventListener("pointercancel", function () { down = false; });
      /* the click a finger sends after a swipe is not a tap */
      pc.addEventListener("click", function (e) { if (swiped) { swiped = false; e.stopImmediatePropagation(); e.preventDefault(); } }, true);
    });
  })();

  window.__fx = { relang: function () { split(); } };
})();
</script>
