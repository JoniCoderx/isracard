<script>
/* The desk. A black leather surface with loose stones on it (round, oval,

   lying open and one in a loose loop. The pointer is a hand passing over the
   desk: it pushes what it touches, by how fast it moves, and the stones slide,
   knock into each other, turn and settle on the leather. A small light follows
   the hand across the leather, and a stone catches a glint as it moves.

   each one is drawn as a picture, with a soft shadow under it; the bracelets
   are chains of real links, each link held to the next at a fixed distance.

   It only runs while the desk is on screen and something is moving, and it
   sleeps the moment everything has come to rest. With reduced motion the desk
