<script>
/* The 36: one stone fills the dark; as you scroll the camera pulls back, the other thirty-five come out of the black, the settings close around them, the metal joins them, and the thirty-six are the Line. One object, no cut. */
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); }, sec = $("s36"); if (!sec) return;
  var pin = sec.querySelector(".s36pin"), cv = $("cv36"), ctx = cv.getContext("2d"), t36 = $("t36"), endEl = $("s36end"), curEl = $("s36cur");
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var N = 36, cur = 10, W = 1, H = 1, D = 1, lastP = -1, lastLang = "", t0 = performance.now();
  var SPEC = { cut: "round", orient: "along", set: "prong", ratio: 1 };
  function size() { D = Math.min(devicePixelRatio || 1, 2); W = Math.max(1, pin.clientWidth); H = Math.max(1, pin.clientHeight); cv.width = Math.round(W * D); cv.height = Math.round(H * D); ctx.setTransform(D, 0, 0, D, 0, 0); lastP = -1; }
  addEventListener("resize", size); size();
  if (window.__renderStone) try { window.__renderStone("round"); } catch (e) {}
  function ease(x) { x = x < 0 ? 0 : x > 1 ? 1 : x; return x * x * (3 - 2 * x); }
  function metal() { var b = window.__build || {}; return { white: "#e9e9ee", yellow: "#e2c26a", rose: "#e0ab90", platinum: "#dfe1e6" }[b.metal] || "#e9e9ee"; }
  function label() { var he = document.documentElement.getAttribute("data-lang") === "he"; curEl.textContent = he ? "אבן " + (cur + 1) : "STONE " + (cur + 1); }
  label();
  $("s36prev").addEventListener("click", function () { cur = (cur + N - 1) % N; label(); lastP = -1; });
  $("s36next").addEventListener("click", function () { cur = (cur + 1) % N; label(); lastP = -1; });
  /* the drawer with the specification of the line: no report numbers we do not hold */
  var drawer = $("sdrawer");
  function openDrawer() { drawer.classList.add("open"); drawer.setAttribute("aria-hidden", "false"); if (window.__lock) window.__lock(); }
  function closeDrawer() { if (!drawer.classList.contains("open")) return; drawer.classList.remove("open"); drawer.setAttribute("aria-hidden", "true"); if (window.__unlock) window.__unlock(); }
  $("s36details").addEventListener("click", openDrawer);
  drawer.addEventListener("click", function (e) { if (e.target === drawer || e.target.closest("[data-close]")) closeDrawer(); });
  addEventListener("keydown", function (e) { if (e.key === "Escape") closeDrawer(); });
  function draw(p, t) {
    var gem = window.__gem; if (!gem) return;
    ctx.clearRect(0, 0, W, H);
    var m = metal(), mobile = W < 700, i;
    var R0 = Math.min(W, H) * (mobile ? 0.30 : 0.24), a = W * (mobile ? 0.44 : 0.40), b = mobile ? H * 0.15 : H * 0.20;
    var circ = 2 * Math.PI * Math.sqrt((a * a + b * b) / 2), R1 = Math.min(R0, circ / N / 2.3);
    var q = ease((p - 0.06) / 0.50), R = R0 + (R1 - R0) * q, cx = W / 2, cy = mobile ? H * 0.42 : H * 0.5, ea = a * q, eb = b * q;
    var others = ease((p - 0.30) / 0.26), seatA = ease((p - 0.52) / 0.22), linkA = ease((p - 0.64) / 0.18), claspA = ease((p - 0.80) / 0.14);
    var pts = [];
    for (i = 0; i < N; i++) { var th = Math.PI / 2 + (i - cur) * 2 * Math.PI / N, s = Math.sin(th), c = Math.cos(th); pts.push({ i: i, x: cx + ea * c, y: cy + eb * s, s: s, r: R * (0.84 + 0.16 * s), ang: Math.atan2(eb * c, -ea * s) }); }
    /* the featured stone at rest: a soft pool of shadow beneath it */
    if (q < 1) { var sh = ctx.createRadialGradient(cx, cy + R * 0.9, R * 0.2, cx, cy + R * 0.9, R * 1.6); sh.addColorStop(0, "rgba(0,0,0,.55)"); sh.addColorStop(1, "rgba(0,0,0,0)"); ctx.globalAlpha = 1 - q; ctx.fillStyle = sh; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
    /* the metal that joins them */
    if (linkA > 0.01) { ctx.save(); ctx.globalAlpha = linkA; ctx.strokeStyle = m; ctx.lineWidth = R1 * 0.42; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.beginPath(); for (i = 0; i < N; i++) { var k = (cur + 18 + i) % N; if (i === 0) ctx.moveTo(pts[k].x, pts[k].y); else ctx.lineTo(pts[k].x, pts[k].y); } ctx.closePath(); ctx.stroke(); ctx.restore(); }
    var order = pts.slice().sort(function (u, v) { return u.s - v.s; });
    for (i = 0; i < N; i++) {
      var pt = order[i], featured = pt.i === cur, alpha = featured ? 1 : others * (0.55 + 0.45 * (pt.s * 0.5 + 0.5));
      if (alpha < 0.01) continue;
      if (seatA > 0.01) { ctx.globalAlpha = alpha * seatA; gem(ctx, pt.x, pt.y, pt.r, pt.r, t, pt.i, m, pt.ang, 0, SPEC); }
      ctx.globalAlpha = alpha; gem(ctx, pt.x, pt.y, pt.r, pt.r, t, pt.i, m, pt.ang, 2, SPEC);
      if (seatA > 0.01) { ctx.globalAlpha = alpha * seatA; gem(ctx, pt.x, pt.y, pt.r, pt.r, t, pt.i, m, pt.ang, 3, SPEC); }
    }
    ctx.globalAlpha = 1;
    /* the clasp closes the ring at the back */
    if (claspA > 0.01) { var kc = (cur + 18) % N, pc = pts[kc]; ctx.save(); ctx.globalAlpha = claspA * 0.9; ctx.translate(pc.x, pc.y); ctx.rotate(pc.ang); ctx.fillStyle = m; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(-R1 * 1.5, -R1 * 0.7, R1 * 3, R1 * 1.4, R1 * 0.3); else ctx.rect(-R1 * 1.5, -R1 * 0.7, R1 * 3, R1 * 1.4); ctx.fill(); ctx.restore(); }
  }
  function tick(now) {
    requestAnimationFrame(tick);
    var r = sec.getBoundingClientRect(); if (r.bottom < 0 || r.top > innerHeight) return;
    var p = reduce ? 1 : Math.max(0, Math.min(1, -r.top / Math.max(1, r.height - innerHeight)));
    var lang = document.documentElement.getAttribute("data-lang") || "en"; if (lang !== lastLang) { lastLang = lang; label(); }
    var tv = 1 - ease((p - 0.04) / 0.12); t36.style.opacity = tv.toFixed(3); t36.style.pointerEvents = tv > 0.5 ? "auto" : "none";
    var ev = ease((p - 0.86) / 0.12); endEl.style.opacity = ev.toFixed(3);
    var t = (now - t0) / 1000;
    if (Math.abs(p - lastP) > 0.0005 || (p < 0.9 && !reduce)) { lastP = p; draw(p, t); }
  }
  requestAnimationFrame(tick);
})();
</script>
